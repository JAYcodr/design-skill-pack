<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
:root{
  --wall:#e8e4de;
  --wall-2:#d9d4cc;
  --case:#0f0f0f;
  --case-2:#1a1a1a;
  --glass:rgba(255,255,255,.08);
  --plaque:#f5f3ef;
  --plaque-2:#e6e2da;
  --gold:#c5a059;
  --gold-2:#8c6f30;
  --ink:#1a1714;
  --ink-2:#4a4540;
  --ink-3:#7a7268;
  --spotlight:rgba(255,255,255,.12);
  --accent:#8b1e1e;
  --accent-soft:#f3e3e3;
  --s1:#6b4c6d; --s1b:#ece3ed;
  --s2:#2b5a7c; --s2b:#e1ecf3;
  --s3:#a14d18; --s3b:#f5e6db;
  --s4:#3a6b3a; --s4b:#e0ecde;
  --s5:#7d6a1e; --s5b:#f3efd9;
  --radius:3px;
  --shadow:0 18px 50px rgba(0,0,0,.35), 0 4px 12px rgba(0,0,0,.15);
  --serif:Georgia,"Noto Serif SC","Songti SC",serif;
  --sans:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:100px}
body{
  background-color:var(--wall);color:var(--ink);
  font-family:var(--sans);line-height:1.6;
  background-image:
    radial-gradient(circle at 50% -10%, rgba(255,255,255,.4) 0, transparent 55%),
    radial-gradient(circle at 80% 90%, rgba(0,0,0,.04) 0, transparent 40%),
    repeating-linear-gradient(90deg, rgba(0,0,0,.012) 0 1px, transparent 1px 120px);
  -webkit-font-smoothing:antialiased;
}
.wrap{max-width:1240px;margin:0 auto;padding:0 22px}

/* ---------- HERO ---------- */
.hero{
  position:relative;padding:46px 0 40px;
}
.hero::before{
  content:"";position:absolute;inset:0;background:radial-gradient(ellipse 80% 50% at 50% -20%, rgba(255,255,255,.5), transparent 70%);pointer-events:none;
}
.entrance{
  background:var(--plaque);border:1px solid var(--wall-2);box-shadow:0 2px 10px rgba(0,0,0,.08);
  padding:28px 36px 26px;text-align:center;position:relative;
}
.entrance::before,.entrance::after{
  content:"";position:absolute;width:60px;height:60px;border:3px solid var(--gold);opacity:.5;
}
.entrance::before{top:12px;left:12px;border-right:none;border-bottom:none}
.entrance::after{bottom:12px;right:12px;border-left:none;border-top:none}
.kicker{
  font-family:var(--serif);font-size:13px;letter-spacing:.25em;text-transform:uppercase;color:var(--gold-2);margin-bottom:10px;font-weight:700;
}
h1{font-family:var(--serif);font-size:clamp(32px,5.5vw,52px);font-weight:700;line-height:1.15;letter-spacing:.02em;margin-bottom:14px;color:var(--ink)}
h1 em{font-style:italic;color:var(--accent)}
.hero-meta{display:flex;justify-content:center;flex-wrap:wrap;gap:10px 24px;color:var(--ink-2);font-size:14px;margin-bottom:28px;font-family:var(--mono)}
.hero-meta span{display:inline-flex;align-items:center;gap:6px}
.hero-meta b{color:var(--ink)}

.featured-case{
  background:var(--case);border:1px solid var(--gold);box-shadow:var(--shadow);border-radius:var(--radius);
  padding:0;position:relative;overflow:hidden;max-width:720px;margin:0 auto 34px;
}
.featured-case::before{
  content:"";position:absolute;inset:0;background:linear-gradient(135deg, rgba(255,255,255,.08) 0, transparent 40%, transparent 60%, rgba(255,255,255,.04) 100%);pointer-events:none;z-index:2;
}
.featured-case::after{
  content:"";position:absolute;inset:0;border:10px solid transparent;border-image:linear-gradient(135deg, rgba(197,160,89,.5), rgba(197,160,89,.1)) 1;pointer-events:none;z-index:3;
}
.spot{
  position:absolute;top:0;left:50%;width:100%;height:60%;background:radial-gradient(ellipse at 50% 0, var(--spotlight), transparent 60%);pointer-events:none;transform:translateX(-50%);z-index:1;
}
.fc-body{padding:28px 30px 24px;position:relative;z-index:4}
.fc-label{
  font-family:var(--serif);font-size:12px;letter-spacing:.2em;text-transform:uppercase;color:var(--gold);margin-bottom:8px;
}
.fc-title{font-family:var(--serif);font-size:24px;font-weight:700;color:#fff;margin-bottom:12px;word-break:break-word}
.fc-title a{color:#fff;text-decoration:none}
.fc-title a:hover{color:var(--gold);text-decoration:underline;text-underline-offset:3px}
.fc-title .own{color:var(--gold);font-weight:400}
.fc-sum{font-size:14px;color:#c9c5bc;line-height:1.75;margin-bottom:18px;max-width:560px}
.fc-stats{display:flex;flex-wrap:wrap;gap:8px;align-items:center}
.fc-stat{
  display:inline-flex;align-items:center;gap:5px;font-size:12px;font-weight:600;
  padding:4px 10px;border:1px solid rgba(255,255,255,.15);background:rgba(255,255,255,.05);color:#e0ddd5;border-radius:2px;
}
.fc-stat.gold{border-color:var(--gold);background:rgba(197,160,89,.12);color:var(--gold)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:14px;max-width:900px;margin:0 auto 28px}
.kpi{
  background:var(--plaque);border:1px solid var(--wall-2);padding:14px 16px;text-align:center;position:relative;
  box-shadow:0 2px 8px rgba(0,0,0,.06);
}
.kpi::before{
  content:"";position:absolute;top:6px;left:50%;width:8px;height:8px;background:var(--gold);border-radius:50%;transform:translateX(-50%);
}
.kpi .n{font-family:var(--serif);font-size:28px;font-weight:700;color:var(--accent);line-height:1.1}
.kpi .l{font-size:12px;color:var(--ink-2);margin-top:4px;font-weight:600;letter-spacing:.02em}

.sectionbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;max-width:900px;margin:0 auto}
.sb{
  display:flex;align-items:center;gap:10px;padding:12px 14px;
  background:var(--plaque);border:1px solid var(--wall-2);text-decoration:none;color:var(--ink-2);
  box-shadow:0 2px 6px rgba(0,0,0,.05);transition:.18s;
}
.sb:hover{background:#fff;color:var(--ink);transform:translateY(-2px);box-shadow:0 4px 12px rgba(0,0,0,.08)}
.sb .sbn{font-family:var(--serif);font-size:26px;font-weight:700;color:var(--accent);min-width:38px}
.sb .sbl{font-size:13px;font-weight:700;line-height:1.35;color:var(--ink-2)}

/* ---------- NAV ---------- */
nav{position:sticky;top:0;z-index:50;background:rgba(232,228,222,.95);backdrop-filter:blur(10px);border-bottom:1px solid var(--wall-2);box-shadow:0 2px 10px rgba(0,0,0,.06)}
.navin{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.navin::-webkit-scrollbar{display:none}
.navin a{
  flex:none;display:inline-flex;align-items:center;gap:7px;
  padding:7px 14px;border:1px solid var(--wall-2);border-radius:2px;
  background:var(--plaque);color:var(--ink-2);text-decoration:none;
  font-size:13px;font-weight:700;white-space:nowrap;transition:.16s;
}
.navin a:hover{border-color:var(--gold);color:var(--gold);background:#fff}
.navin a .c{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:999px;background:var(--wall-2);color:var(--ink-3)}
.navin a:hover .c{background:var(--gold);color:#fff}
.navin a .pip{width:8px;height:8px;border-radius:2px}

/* ---------- MAIN ---------- */
main{padding:38px 0 14px}
section{margin-bottom:56px;scroll-margin-top:100px}
.hall{
  background:rgba(0,0,0,.03);border:1px solid rgba(0,0,0,.08);border-radius:4px;
  padding:34px 22px 28px;position:relative;
}
.hall::before{
  content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg, rgba(0,0,0,.015) 0 1px, transparent 1px 80px);pointer-events:none;border-radius:4px;
}
.hall-header{display:flex;align-items:baseline;gap:14px;margin-bottom:8px;position:relative;z-index:1}
.hall-header h2{font-family:var(--serif);font-size:24px;font-weight:700;color:var(--ink);letter-spacing:.02em}
.hall-header .cnt{font-family:var(--mono);font-size:12px;color:var(--ink-3);font-weight:700;padding:3px 10px;border-radius:999px;background:var(--wall-2)}
.hall-desc{color:var(--ink-2);font-size:14px;margin:0 0 26px 6px;font-style:italic;position:relative;z-index:1}

.gallery{
  display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:22px;position:relative;z-index:1;
}

.case{
  background:var(--case);border:1px solid rgba(197,160,89,.35);border-radius:var(--radius);
  box-shadow:0 14px 40px rgba(0,0,0,.28);position:relative;overflow:hidden;transition:.22s;
  display:flex;flex-direction:column;
}
.case:hover{transform:translateY(-4px);box-shadow:0 22px 56px rgba(0,0,0,.35);border-color:rgba(197,160,89,.6)}
.case::before{
  content:"";position:absolute;inset:0;background:linear-gradient(145deg, rgba(255,255,255,.07) 0, transparent 45%, transparent 55%, rgba(255,255,255,.03) 100%);pointer-events:none;z-index:2;
}
.case::after{
  content:"";position:absolute;inset:8px;border:1px solid rgba(197,160,89,.2);pointer-events:none;z-index:3;border-radius:1px;
}
.case-spot{
  position:absolute;top:0;left:50%;width:100%;height:55%;background:radial-gradient(ellipse at 50% 0, rgba(255,255,255,.08), transparent 60%);pointer-events:none;transform:translateX(-50%);z-index:1;
}
.case-body{padding:22px 22px 18px;position:relative;z-index:4;display:flex;flex-direction:column;gap:12px;flex:1}
.case-badge{
  position:absolute;top:16px;right:16px;font-family:var(--serif);font-size:12px;font-weight:700;letter-spacing:.06em;color:var(--case);background:var(--gold);padding:3px 9px;border-radius:2px;z-index:5;
}
.case-num{
  position:absolute;top:16px;left:16px;width:34px;height:34px;border:2px solid var(--gold);border-radius:50%;
  display:grid;place-items:center;font-family:var(--serif);font-size:14px;font-weight:700;color:var(--gold);z-index:5;
}
.case-title{font-family:var(--serif);font-size:17px;font-weight:700;color:#fff;margin-top:36px;line-height:1.4;word-break:break-word}
.case-title .own{color:var(--gold);font-weight:400}
.case-title a{color:inherit;text-decoration:none}
.case-title a:hover{color:var(--gold);text-decoration:underline;text-underline-offset:3px}
.case-sum{font-size:13px;color:#c9c5bc;line-height:1.7;flex:1}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:3px 9px;border:1px solid rgba(255,255,255,.12);border-radius:2px;
  background:rgba(255,255,255,.06);color:#c9c5bc;white-space:nowrap;
}
.chip .lg{width:7px;height:7px;border-radius:50%;flex:none}
.chip.gold{border-color:rgba(197,160,89,.4);background:rgba(197,160,89,.12);color:var(--gold)}
.chip.green{border-color:rgba(76,175,80,.35);background:rgba(76,175,80,.1);color:#81c784}

.case-footer{
  display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:14px;border-top:1px solid rgba(255,255,255,.1);
}
.case-forks{font-family:var(--mono);font-size:11px;color:#9e9a90}
.go{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;letter-spacing:.04em;
  color:var(--gold);text-decoration:none;padding:5px 10px;border-radius:2px;
  border:1px solid rgba(197,160,89,.4);background:rgba(197,160,89,.08);transition:.16s;text-transform:uppercase;
}
.go:hover{background:var(--gold);color:var(--case)}
.go svg{width:12px;height:12px;fill:currentColor}

/* ---------- FOOTER ---------- */
footer{padding:30px 0 44px}
.footer-plaque{
  background:var(--plaque);border:1px solid var(--wall-2);border-radius:2px;box-shadow:0 2px 10px rgba(0,0,0,.06);padding:24px 28px;position:relative;
}
.footer-plaque::before{
  content:"";position:absolute;inset:8px;border:1px solid rgba(0,0,0,.08);pointer-events:none;
}
.fgrid{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-start;position:relative;z-index:1}
.fnote{font-size:13px;color:var(--ink-2);line-height:1.85;max-width:640px}
.fnote strong{color:var(--ink);font-weight:700;font-family:var(--serif)}
.fstat{display:flex;gap:10px;flex-wrap:wrap}
.fstat div{background:var(--wall-2);border:1px solid rgba(0,0,0,.08);border-radius:2px;padding:9px 14px;font-size:12px;color:var(--ink-2)}
.fstat b{display:block;font-family:var(--serif);font-size:17px;color:var(--accent);font-weight:700}
.fsrc{margin-top:16px;font-size:12px;color:var(--ink-3);position:relative;z-index:1}
.fsrc a{color:var(--accent);text-decoration:none}
.fsrc a:hover{text-decoration:underline}

.top{
  position:fixed;right:20px;bottom:22px;width:42px;height:42px;border-radius:50%;
  background:var(--plaque);border:1px solid var(--wall-2);box-shadow:0 4px 14px rgba(0,0,0,.12);
  display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:.22s;z-index:60;
}
.top.on{opacity:1;pointer-events:auto}
.top:hover{background:var(--gold);border-color:var(--gold)}
.top svg{width:17px;height:17px;fill:var(--ink-2)}
.top:hover svg{fill:#fff}

@media (max-width:760px){
  .hero{padding:30px 0}
  .entrance{padding:20px 24px 18px}
  .entrance::before,.entrance::after{width:40px;height:40px}
  h1{font-size:30px}
  .featured-case{max-width:100%}
  .gallery{grid-template-columns:1fr}
  .hall{padding:24px 16px 20px}
  .hall-desc{margin-left:0}
  main{padding:24px 0 10px}
}
</style>
</head>
<body>

<header class="hero" id="top">
  <div class="wrap">
    <div class="entrance">
      <div class="kicker">{{KICKER}}</div>
      <h1>{{HEADLINE}}</h1>
      <div class="hero-meta">
        <span>展期 <b id="heroDate">—</b></span>
        <span>开馆 <b id="heroTime">—</b></span>
        <span>口径 <b>{{SCOPE}}</b></span>
      </div>

      <div class="featured-case" id="featuredCase">
        <div class="spot"></div>
        <div class="fc-body">
          <div class="fc-label">今日镇馆之宝 · Today's Featured</div>
          <div class="fc-title" id="fTitle">—</div>
          <div class="fc-sum" id="fSum">—</div>
          <div class="fc-stats" id="fStats"></div>
        </div>
      </div>

      <div class="kpis">
        <div class="kpi"><div class="n" id="kTotal">0</div><div class="l">展品总数</div></div>
        <div class="kpi"><div class="n" id="kStars">0</div><div class="l">今日新增关注</div></div>
        <div class="kpi"><div class="n" id="kTop">0</div><div class="l">镇馆之宝热度</div></div>
        <div class="kpi"><div class="n" id="kLang">0</div><div class="l">展品语言</div></div>
        <div class="kpi"><div class="n">5</div><div class="l">展厅</div></div>
      </div>
    </div>

    <div class="sectionbar" id="sectionBar"></div>
  </div>
</header>

<nav><div class="wrap"><div class="navin" id="nav"></div></div></nav>

<main class="wrap" id="main"></main>

<footer>
  <div class="wrap">
    <div class="footer-plaque">
      <div class="fgrid">
        <div class="fnote">
          本期共收录 <strong id="fTotal">0</strong> 个条目，{{FOOTER_NOTE}}
        </div>
        <div class="fstat">
          <div><b id="fRepos">0</b>展品</div>
          <div><b id="fStars">0</b>今日关注</div>
          <div><b id="fLangs">0</b>语言</div>
        </div>
      </div>
      <div class="fsrc">
        数据来源：{{SOURCE_HTML}}
        　·　生成时间：<span id="fTime">—</span>　·　全部时间均为北京时间（UTC+8）
      </div>
    </div>
  </div>
</footer>

<div class="top" id="toTop" title="回到顶部"><svg viewBox="0 0 16 16"><path d="M8 3.5 2.5 9l1.06 1.06L8 5.62l4.44 4.44L13.5 9 8 3.5Z"/></svg></div>

<script>
const CAPTURED_AT = "{{CAPTURED_AT}}";

const SECTIONS = {{SECTIONS}};

const LANG_COLOR = {
  "Python":"#3572A5","TypeScript":"#3178c6","JavaScript":"#f1e05a","Rust":"#dea584","Go":"#00ADD8",
  "Java":"#b07219","C++":"#f34b7d","C":"#555555","C#":"#178600","Jupyter Notebook":"#DA5B0B","Other":"#8b949e"
};
const DATA = {{DATA}};

/* ---------- 时间：ISO -> 北京时间人话 ---------- */
const WD = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function bj(iso){
  const t = new Date(iso);
  const p = new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",year:"numeric",month:"numeric",
    day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false,weekday:"short"}).formatToParts(t);
  const g = k => (p.find(x=>x.type===k)||{}).value || "";
  const wd = WD[new Date(t.toLocaleString("en-US",{timeZone:"Asia/Shanghai"})).getDay()];
  const h = parseInt(g("hour"),10);
  const period = h<5?"凌晨":h<9?"清晨":h<12?"上午":h<14?"中午":h<18?"下午":h<23?"晚上":"深夜";
  return {
    date:`${g("year")} 年 ${g("month")} 月 ${g("day")} 日 · ${wd}`,
    time:`${period} ${h}:${g("minute")}`,
    full:`${g("year")} 年 ${g("month")} 月 ${g("day")} 日 ${wd} ${period} ${h}:${g("minute")}（北京时间）`
  };
}
const fmt = n => n.toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- 分组 + 全局连续编号 ---------- */
const groups = SECTIONS.map(sec=>({
  ...sec,
  items: DATA.filter(d=>d.s===sec.id).sort((a,b)=>b.today-a.today)
}));
let seq = 0;
groups.forEach(g=>g.items.forEach(it=>{ it.no = ++seq; }));

const TOTAL   = seq;
const SUMSTAR = DATA.reduce((a,b)=>a+b.today,0);
const LANGS   = [...new Set(DATA.map(d=>d.lang))];
const TOP     = [...DATA].sort((a,b)=>b.today-a.today)[0];

/* ---------- Hero ---------- */
const T = bj(CAPTURED_AT);
document.getElementById("heroDate").textContent = T.date;
document.getElementById("heroTime").textContent = T.time;
document.getElementById("kTotal").textContent = TOTAL;
document.getElementById("kStars").textContent = "+" + fmt(SUMSTAR);
document.getElementById("kTop").textContent = "+" + fmt(TOP.today);
document.getElementById("kLang").textContent = LANGS.length;

const topOwner = TOP.repo.split("/")[0], topName = TOP.repo.split("/")[1];
const topLc = LANG_COLOR[TOP.lang] || LANG_COLOR.Other;
document.getElementById("fTitle").innerHTML = `<a href="https://github.com/${TOP.repo}" target="_blank" rel="noopener noreferrer"><span class="own">${esc(topOwner)} /</span> ${esc(topName)}</a>`;
document.getElementById("fSum").textContent = TOP.sum;
document.getElementById("fStats").innerHTML = `
  <span class="fc-stat gold"><i style="display:inline-block;width:7px;height:7px;border-radius:50%;background:${topLc};margin-right:4px"></i>${esc(TOP.lang)}</span>
  <span class="fc-stat">★ ${fmt(TOP.stars)}</span>
  <span class="fc-stat gold">今日 +${fmt(TOP.today)}</span>
  <span class="fc-stat">Fork ${fmt(TOP.forks)}</span>
  <span class="fc-stat">${esc(TOP.src)}</span>`;

document.getElementById("sectionBar").innerHTML = groups.map(g=>`
  <a class="sb" href="#${g.id}">
    <span class="sbn">${g.items.length}</span>
    <span class="sbl">${g.name}</span>
  </a>`).join("");

/* ---------- 锚点导航 ---------- */
document.getElementById("nav").innerHTML =
  `<a href="#top"><span class="pip" style="background:var(--gold)"></span>入口</a>` +
  groups.map(g=>`<a href="#${g.id}"><span class="pip" style="background:${g.color}"></span>${g.name}<span class="c">${g.items.length}</span></a>`).join("");

/* ---------- 正文卡片 ---------- */
document.getElementById("main").innerHTML = groups.map(g=>`
  <section id="${g.id}">
    <div class="hall">
      <div class="hall-header">
        <h2>${g.name}</h2>
        <span class="cnt">${g.items.length} 件展品</span>
      </div>
      <p class="hall-desc">${g.desc}</p>
      <div class="gallery">
        ${g.items.map(it=>{
          const owner = it.repo.split("/")[0], name = it.repo.split("/")[1];
          const lc = LANG_COLOR[it.lang] || LANG_COLOR.Other;
          const hot = it.today >= 400;
          return `
          <article class="case">
            <div class="case-spot"></div>
            <span class="case-num">${String(it.no).padStart(2,"0")}</span>
            ${hot?'<span class="case-badge">HOT</span>':''}
            <div class="case-body">
              <h3 class="case-title"><a href="https://github.com/${it.repo}" target="_blank" rel="noopener noreferrer"><span class="own">${esc(owner)} /</span> ${esc(name)}</a></h3>
              <p class="case-sum">${esc(it.sum)}</p>
              <div class="chips">
                <span class="chip"><i class="lg" style="background:${lc}"></i>${esc(it.lang)}</span>
                <span class="chip">${esc(it.src)}</span>
                <span class="chip gold">★ ${fmt(it.stars)}</span>
                <span class="chip green">今日 +${fmt(it.today)}</span>
              </div>
              <div class="case-footer">
                <span class="case-forks">Fork ${fmt(it.forks)}</span>
                <a class="go" href="https://github.com/${it.repo}" target="_blank" rel="noopener noreferrer">
                  参观<svg viewBox="0 0 16 16"><path d="M3.75 2h3.5a.75.75 0 0 1 0 1.5h-3.5a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25v-3.5a.75.75 0 0 1 1.5 0v3.5A1.75 1.75 0 0 1 12.25 14h-8.5A1.75 1.75 0 0 1 2 12.25v-8.5C2 2.784 2.784 2 3.75 2Zm6.5-1h4a.75.75 0 0 1 .75.75v4a.75.75 0 0 1-1.5 0V3.56L8.28 8.78a.75.75 0 0 1-1.06-1.06L12.44 2.5h-2.19a.75.75 0 0 1 0-1.5Z"/></svg>
                </a>
              </div>
            </div>
          </article>`;
        }).join("")}
      </div>
    </div>
  </section>`).join("");

/* ---------- 页脚 ---------- */
document.getElementById("fTotal").textContent = TOTAL;
document.getElementById("fRepos").textContent = TOTAL;
document.getElementById("fStars").textContent = "+" + fmt(SUMSTAR);
document.getElementById("fLangs").textContent = LANGS.length;
document.getElementById("fTime").textContent  = T.full;
document.title = `{{DOC_TITLE_PREFIX}} · ${T.date.split(" · ")[0]}`;

/* ---------- 回到顶部 ---------- */
const btnTop = document.getElementById("toTop");
btnTop.addEventListener("click", ()=>window.scrollTo({top:0,behavior:"smooth"}));
addEventListener("scroll", ()=>btnTop.classList.toggle("on", scrollY>500), {passive:true});
</script>
</body>
</html>
