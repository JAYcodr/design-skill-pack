<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
:root{
  --bg:#050505; --surface:#0a0a0a; --surface-2:#141414;
  --border:#2a2a2a; --border-soft:#1a1a1a;
  --text:#e8e8e8; --text-2:#888; --text-3:#555;
  --up:#00ff41; --up-dim:#0a3a12;
  --down:#ff3333; --down-dim:#3a0a0a;
  --amber:#ffb000; --amber-dim:#3d2a00;
  --accent:#00ff41;
  --s1:#b388ff; --s1b:#1a1025;
  --s2:#60a5fa; --s2b:#0a1a2e;
  --s3:#fb923c; --s3b:#2a1505;
  --s4:#4ade80; --s4b:#0a2a10;
  --s5:#facc15; --s5b:#2a2200;
  --radius:2px;
  --shadow:0 0 20px rgba(0,255,65,.06);
  --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--mono);line-height:1.5;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px}

/* ---------- TICKER HERO ---------- */
.hero{
  background:var(--surface);border-bottom:1px solid var(--border);padding:38px 0 34px;
  position:relative;overflow:hidden;
}
.hero::before{
  content:"";position:absolute;inset:0;
  background:repeating-linear-gradient(0deg,transparent,transparent 2px,rgba(0,255,65,.02) 2px,rgba(0,255,65,.02) 4px);
  pointer-events:none;
}
.hero .wrap{position:relative}
.marquee-outer{
  background:#000;border:1px solid var(--border);padding:10px 16px;margin-bottom:20px;
  font-size:13px;color:var(--up);text-shadow:0 0 8px rgba(0,255,65,.4);letter-spacing:.04em;
  white-space:nowrap;overflow:hidden;position:relative;
}
.marquee-outer::before{content:"▶ LIVE";color:var(--amber);margin-right:12px;text-shadow:0 0 8px rgba(255,176,0,.4)}
.marquee{animation:scroll 24s linear infinite;display:inline-block}
@keyframes scroll{0%{transform:translateX(0)}100%{transform:translateX(-50%)}}
.brand-row{display:flex;align-items:baseline;gap:14px;margin-bottom:16px;flex-wrap:wrap}
.brand-row .kicker{font-size:12px;letter-spacing:.2em;color:var(--text-3);font-weight:700}
h1{font-size:clamp(26px,4.8vw,44px);font-weight:800;line-height:1.1;color:#fff;letter-spacing:-.01em}
h1 em{font-style:normal;color:var(--up);text-shadow:0 0 12px rgba(0,255,65,.35)}

.hero-meta{display:flex;flex-wrap:wrap;gap:10px 18px;color:var(--text-2);font-size:13px;margin-bottom:24px}
.hero-meta span{display:inline-flex;align-items:center;gap:6px}
.hero-meta b{color:var(--text)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:22px}
.kpi{
  background:#000;border:1px solid var(--border);padding:16px 18px;
  display:flex;flex-direction:column;gap:6px;position:relative;
}
.kpi::before{content:"";position:absolute;inset:-1px;border:1px solid var(--up);opacity:.15}
.kpi.main::before{border-color:var(--up);opacity:.35}
.kpi .n{font-size:32px;font-weight:800;line-height:1;color:var(--up);text-shadow:0 0 14px rgba(0,255,65,.25);font-variant-numeric:tabular-nums}
.kpi .l{font-size:11px;color:var(--text-3);letter-spacing:.04em;text-transform:uppercase}
.kpi.main{background:var(--up-dim)}
.kpi.main .n{color:var(--up);text-shadow:0 0 18px rgba(0,255,65,.4)}

.sectionbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.sb{
  display:flex;flex-direction:column;gap:5px;padding:12px 14px;
  background:#000;border:1px solid var(--border);text-decoration:none;color:var(--text-2);transition:.18s;
}
.sb:hover{border-color:var(--up);box-shadow:0 0 12px rgba(0,255,65,.08);color:var(--text)}
.sb .sbtop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sb .sbn{font-size:24px;font-weight:800;color:var(--up);text-shadow:0 0 10px rgba(0,255,65,.2);font-variant-numeric:tabular-nums}
.sb .sbl{font-size:12px;color:var(--text-2);line-height:1.35;letter-spacing:.02em}
.sb .bar{height:2px;background:var(--border);overflow:hidden;margin-top:6px}
.sb .bar i{display:block;height:100%;background:var(--up);box-shadow:0 0 6px rgba(0,255,65,.3)}

/* ---------- NAV ---------- */
nav{position:sticky;top:0;z-index:50;background:rgba(5,5,5,.95);border-bottom:1px solid var(--border);backdrop-filter:blur(10px)}
.navin{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.navin::-webkit-scrollbar{display:none}
.navin a{
  flex:none;display:inline-flex;align-items:center;gap:7px;
  padding:7px 14px;border:1px solid var(--border);border-radius:2px;
  background:#000;color:var(--text-2);text-decoration:none;
  font-size:12px;font-weight:700;white-space:nowrap;letter-spacing:.02em;transition:.16s;
}
.navin a:hover{border-color:var(--up);color:var(--up);background:var(--up-dim);box-shadow:0 0 8px rgba(0,255,65,.08)}
.navin a .c{font-size:11px;padding:1px 7px;border-radius:2px;background:var(--surface-2);color:var(--text-3)}
.navin a:hover .c{background:var(--up);color:#000}
.navin a .pip{width:8px;height:8px;border-radius:1px}

/* ---------- MAIN ---------- */
main{padding:34px 0 10px}
section{margin-bottom:44px;scroll-margin-top:90px}
.shead{display:flex;align-items:center;gap:12px;margin-bottom:8px;padding-bottom:10px;border-bottom:1px solid var(--border)}
.shead .idx{
  width:30px;height:30px;border-radius:2px;display:grid;place-items:center;
  font-size:13px;font-weight:800;flex:none;font-family:var(--mono);border:1px solid var(--border);
}
.shead h2{font-size:18px;font-weight:800;letter-spacing:.02em;color:#fff}
.shead .cnt{font-size:11px;color:var(--text-3);font-weight:700;padding:3px 10px;border-radius:2px;background:#000;border:1px solid var(--border);text-transform:uppercase}
.sdesc{color:var(--text-2);font-size:12px;margin:0 0 18px 42px;letter-spacing:.02em}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:12px}

.card{
  position:relative;background:#000;border:1px solid var(--border);padding:0;
  display:flex;flex-direction:column;overflow:hidden;transition:.18s;
}
.card:hover{border-color:var(--up);box-shadow:0 0 14px rgba(0,255,65,.08);transform:translateY(-2px)}
.ticker-bar{
  display:grid;grid-template-columns:1fr auto auto;padding:12px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);gap:12px;align-items:center;
}
.ticker-bar .symbol{color:var(--up);font-weight:800;font-size:16px;letter-spacing:.02em;word-break:break-all}
.ticker-bar .price{color:#fff;font-size:18px;font-weight:800;text-shadow:0 0 10px rgba(255,255,255,.15);font-variant-numeric:tabular-nums}
.ticker-bar .change{
  display:flex;flex-direction:column;align-items:flex-end;font-variant-numeric:tabular-nums
}
.ticker-bar .change .pct{font-size:14px;font-weight:800;color:var(--up);text-shadow:0 0 8px rgba(0,255,65,.2)}
.ticker-bar .change .abs{font-size:11px;color:var(--text-3)}
.cardbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:11px;flex:1}
.hot{position:absolute;top:8px;right:8px;font-size:10px;font-weight:800;letter-spacing:.06em;color:#000;background:var(--amber);padding:2px 6px;border-radius:2px;box-shadow:0 0 8px rgba(255,176,0,.3)}

.ctop{display:flex;align-items:flex-start;gap:10px}
.num{
  flex:none;min-width:30px;height:26px;padding:0 8px;border-radius:2px;
  display:grid;place-items:center;font-size:12px;font-weight:800;
  font-family:var(--mono);letter-spacing:.02em;background:#000;color:var(--text-2);border:1px solid var(--border);
}
.ttl{font-size:14px;font-weight:700;line-height:1.4;letter-spacing:.01em;word-break:break-word}
.ttl .own{color:var(--text-3);font-weight:600}
.ttl a{color:inherit;text-decoration:none}
.ttl a:hover{color:var(--up);text-decoration:underline;text-underline-offset:3px}

.sum{font-size:13px;color:var(--text-2);line-height:1.65;flex:1}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:700;
  padding:2px 8px;border:1px solid var(--border);border-radius:2px;
  background:#000;color:var(--text-2);white-space:nowrap;letter-spacing:.02em;
}
.chip .lg{width:7px;height:7px;border-radius:50%;flex:none}
.chip.star{border-color:var(--amber-dim);color:var(--amber);background:#000}
.chip.up{border-color:var(--up-dim);color:var(--up);background:#000}
.chip.src{border-color:var(--s2b);color:var(--s2);background:#000}

.cbot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px dashed var(--border)}
.go{
  display:inline-flex;align-items:center;gap:6px;font-size:11px;font-weight:800;letter-spacing:.02em;
  color:var(--up);text-decoration:none;padding:5px 11px;border-radius:2px;
  border:1px solid var(--up);background:#000;transition:.16s;text-transform:uppercase;
}
.go:hover{background:var(--up);color:#000}
.go svg{width:13px;height:13px;fill:currentColor}
.forks{font-size:11px;color:var(--text-3);font-variant-numeric:tabular-nums}

/* ---------- FOOTER ---------- */
footer{border-top:1px solid var(--border);background:#000;margin-top:26px;padding:30px 0 44px}
.fgrid{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-start}
.fnote{font-size:12px;color:var(--text-2);line-height:1.85;max-width:640px;letter-spacing:.02em}
.fnote strong{color:#fff;font-weight:800}
.fstat{display:flex;gap:10px;flex-wrap:wrap}
.fstat div{background:#000;border:1px solid var(--border);border-radius:2px;padding:9px 14px;font-size:11px;color:var(--text-2);letter-spacing:.02em;text-transform:uppercase}
.fstat b{display:block;font-size:17px;color:var(--up);font-weight:800;text-shadow:0 0 10px rgba(0,255,65,.2);font-variant-numeric:tabular-nums}
.fsrc{margin-top:16px;font-size:12px;color:var(--text-3);letter-spacing:.02em}
.fsrc a{color:var(--up);text-decoration:none}
.fsrc a:hover{text-decoration:underline}

.top{
  position:fixed;right:20px;bottom:22px;width:42px;height:42px;border-radius:2px;
  background:#000;border:1px solid var(--border);box-shadow:0 0 14px rgba(0,255,65,.1);
  display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:.22s;z-index:60;
}
.top.on{opacity:1;pointer-events:auto}
.top:hover{background:var(--up);border-color:var(--up)}
.top svg{width:17px;height:17px;fill:var(--text-2)}
.top:hover svg{fill:#000}

@media (max-width:760px){
  .hero{padding:28px 0 24px}
  .ticker-bar{grid-template-columns:1fr auto;gap:8px}
  .ticker-bar .change{grid-column:2;grid-row:1/3;justify-content:center}
  .kpi .n{font-size:24px}
  .grid{grid-template-columns:1fr}
  .sdesc{margin-left:0}
  main{padding:24px 0 10px}
}
</style>
</head>
<body>

<header class="hero" id="top">
  <div class="wrap">
    <div class="marquee-outer">
      <div class="marquee" id="marquee">{{KICKER}} · {{SCOPE}} · 数据来源 GitHub Trending · 实时行情仅供今日参考 · </div>
    </div>
    <div class="brand-row">
      <div class="kicker">{{KICKER}}</div>
    </div>
    <h1>{{HEADLINE}}</h1>
    <div class="hero-meta">
      <span><b id="heroDate">—</b></span>
      <span>开盘 <b id="heroTime">—</b></span>
      <span>口径：<b>{{SCOPE}}</b></span>
    </div>

    <div class="kpis">
      <div class="kpi main"><div class="n" id="kTotal">0</div><div class="l">挂牌仓库</div></div>
      <div class="kpi"><div class="n" id="kStars">0</div><div class="l">今日总成交星</div></div>
      <div class="kpi"><div class="n" id="kTop">—</div><div class="l">涨幅冠军</div></div>
      <div class="kpi"><div class="n" id="kLang">0</div><div class="l">交易板块</div></div>
      <div class="kpi"><div class="n">5</div><div class="l">行情分类</div></div>
    </div>

    <div class="sectionbar" id="sectionBar"></div>
  </div>
</header>

<nav><div class="wrap"><div class="navin" id="nav"></div></div></nav>

<main class="wrap" id="main"></main>

<footer>
  <div class="wrap">
    <div class="fgrid">
      <div class="fnote">
        本期共收录 <strong id="fTotal">0</strong> 个条目，{{FOOTER_NOTE}}
      </div>
      <div class="fstat">
        <div><b id="fRepos">0</b>挂牌</div>
        <div><b id="fStars">0</b>涨星</div>
        <div><b id="fLangs">0</b>板块</div>
      </div>
    </div>
    <div class="fsrc">
      数据源：{{SOURCE_HTML}}
      　·　生成时间：<span id="fTime">—</span>　·　全部时间均为北京时间（UTC+8）
    </div>
  </div>
</footer>

<div class="top" id="toTop" title="回到顶部"><svg viewBox="0 0 16 16"><path d="M8 3.5 2.5 9l1.06 1.06L8 5.62l4.44 4.44L13.5 9 8 3.5Z"/></svg></div>

<script>
const CAPTURED_AT = "{{CAPTURED_AT}}";

const SECTIONS = {{SECTIONS}};

const LANG_COLOR = {
  "Python":"#3572A5","TypeScript":"#3178c6","JavaScript":"#f1e05a","Rust":"#dea584","Go":"#00ADD8",
  "Java":"#b07219","C++":"#f34b7d","C":"#555555","C#":"#178600","Jupyter Notebook":"#DA5B0B","Other":"#8b949e"
};
const DATA = {{DATA}};

/* ---------- 时间：ISO -> 北京时间人话 ---------- */
const WD = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function bj(iso){
  const t = new Date(iso);
  const p = new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",year:"numeric",month:"numeric",
    day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false,weekday:"short"}).formatToParts(t);
  const g = k => (p.find(x=>x.type===k)||{}).value || "";
  const wd = WD[new Date(t.toLocaleString("en-US",{timeZone:"Asia/Shanghai"})).getDay()];
  const h = parseInt(g("hour"),10);
  const period = h<5?"凌晨":h<9?"清晨":h<12?"上午":h<14?"中午":h<18?"下午":h<23?"晚上":"深夜";
  return {
    date:`${g("year")} 年 ${g("month")} 月 ${g("day")} 日 · ${wd}`,
    time:`${period} ${h}:${g("minute")}`,
    full:`${g("year")} 年 ${g("month")} 月 ${g("day")} 日 ${wd} ${period} ${h}:${g("minute")}（北京时间）`
  };
}
const fmt = n => n.toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- 分组 + 全局连续编号 ---------- */
const groups = SECTIONS.map(sec=>({
  ...sec,
  items: DATA.filter(d=>d.s===sec.id).sort((a,b)=>b.today-a.today)
}));
let seq = 0;
groups.forEach(g=>g.items.forEach(it=>{ it.no = ++seq; }));

const TOTAL   = seq;
const SUMSTAR = DATA.reduce((a,b)=>a+b.today,0);
const LANGS   = [...new Set(DATA.map(d=>d.lang))];
const TOP     = [...DATA].sort((a,b)=>b.today-a.today)[0];
const MAXSEC  = Math.max(...groups.map(g=>g.items.length));

/* ---------- Hero ---------- */
const T = bj(CAPTURED_AT);
document.getElementById("heroDate").textContent = T.date;
document.getElementById("heroTime").textContent = T.time;
document.getElementById("kTotal").textContent = TOTAL;
document.getElementById("kStars").textContent = "+" + fmt(SUMSTAR);
document.getElementById("kTop").textContent   = "+" + fmt(TOP.today);
document.getElementById("kLang").textContent  = LANGS.length;

const marqueeText = `{{KICKER}} · {{SCOPE}} · 数据来源 GitHub Trending · 实时行情仅供今日参考 · `;
const mq = document.getElementById("marquee");
if(mq) mq.textContent = (marqueeText + " ").repeat(4);

document.getElementById("sectionBar").innerHTML = groups.map(g=>`
  <a class="sb" href="#${g.id}">
    <div class="sbtop"><span class="sbn">+${g.items.length}</span></div>
    <div class="sbl">${g.name}</div>
    <div class="bar"><i style="width:${Math.round(g.items.length/MAXSEC*100)}%;background:${g.color==="var(--s1)"?"#b388ff":g.color==="var(--s2)"?"#60a5fa":g.color==="var(--s3)"?"#fb923c":g.color==="var(--s4)"?"#4ade80":"#facc15"}"></i></div>
  </a>`).join("");

/* ---------- 锚点导航 ---------- */
document.getElementById("nav").innerHTML =
  `<a href="#top"><span class="pip" style="background:#fff"></span>大盘</a>` +
  groups.map(g=>`<a href="#${g.id}"><span class="pip" style="background:${g.color}"></span>${g.name}<span class="c">${g.items.length}</span></a>`).join("");

/* ---------- 正文卡片 ---------- */
document.getElementById("main").innerHTML = groups.map(g=>`
  <section id="${g.id}">
    <div class="shead">
      <div class="idx" style="background:${g.bg};color:${g.color};border-color:${g.color}">${g.icon}</div>
      <h2>${g.name}</h2>
      <span class="cnt">${g.items.length} 档</span>
    </div>
    <p class="sdesc">${g.desc}</p>
    <div class="grid">
      ${g.items.map(it=>{
        const owner = it.repo.split("/")[0], name = it.repo.split("/")[1];
        const lc = LANG_COLOR[it.lang] || LANG_COLOR.Other;
        const hot = it.today >= 400;
        return `
        <article class="card" style="--c:${g.color}">
          ${hot?'<span class="hot">HOT</span>':''}
          <div class="ticker-bar">
            <div class="symbol">${esc(owner)} / ${esc(name)}</div>
            <div class="price">${fmt(it.stars)}</div>
            <div class="change">
              <span class="pct">+${fmt(it.today)}</span>
              <span class="abs">stars today</span>
            </div>
          </div>
          <div class="cardbody">
            <div class="ctop">
              <span class="num" style="background:${g.bg};color:${g.color};border-color:${g.color}">${String(it.no).padStart(2,"0")}</span>
              <h3 class="ttl"><a href="https://github.com/${it.repo}" target="_blank" rel="noopener noreferrer"><span class="own">${esc(owner)} /</span> ${esc(name)}</a></h3>
            </div>
            <p class="sum">${esc(it.sum)}</p>
            <div class="chips">
              <span class="chip"><i class="lg" style="background:${lc}"></i>${esc(it.lang)}</span>
              <span class="chip src">${esc(it.src)}</span>
              <span class="chip star">★ ${fmt(it.stars)}</span>
              <span class="chip up">+${fmt(it.today)}</span>
            </div>
            <div class="cbot">
              <span class="forks">Fork ${fmt(it.forks)}</span>
              <a class="go" href="https://github.com/${it.repo}" target="_blank" rel="noopener noreferrer">
                交易详情<svg viewBox="0 0 16 16"><path d="M3.75 2h3.5a.75.75 0 0 1 0 1.5h-3.5a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25v-3.5a.75.75 0 0 1 1.5 0v3.5A1.75 1.75 0 0 1 12.25 14h-8.5A1.75 1.75 0 0 1 2 12.25v-8.5C2 2.784 2.784 2 3.75 2Zm6.5-1h4a.75.75 0 0 1 .75.75v4a.75.75 0 0 1-1.5 0V3.56L8.28 8.78a.75.75 0 0 1-1.06-1.06L12.44 2.5h-2.19a.75.75 0 0 1 0-1.5Z"/></svg>
              </a>
            </div>
          </div>
        </article>`;
      }).join("")}
    </div>
  </section>`).join("");

/* ---------- 页脚 ---------- */
document.getElementById("fTotal").textContent = TOTAL;
document.getElementById("fRepos").textContent = TOTAL;
document.getElementById("fStars").textContent = "+" + fmt(SUMSTAR);
document.getElementById("fLangs").textContent = LANGS.length;
document.getElementById("fTime").textContent  = T.full;
document.title = `{{DOC_TITLE_PREFIX}} · ${T.date.split(" · ")[0]}`;

/* ---------- 回到顶部 ---------- */
const btnTop = document.getElementById("toTop");
btnTop.addEventListener("click", ()=>window.scrollTo({top:0,behavior:"smooth"}));
addEventListener("scroll", ()=>btnTop.classList.toggle("on", scrollY>500), {passive:true});
</script>
</body>
</html>
