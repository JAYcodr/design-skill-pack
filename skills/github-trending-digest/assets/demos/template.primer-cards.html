<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
:root{
  --bg:#f6f8fa; --surface:#ffffff; --surface-2:#f0f3f6;
  --border:#d8dee4; --border-soft:#e6eaef;
  --text:#1f2328; --text-2:#59636e; --text-3:#818b98;
  --accent:#0969da; --accent-soft:#ddf4ff;
  --star:#bf8700; --star-soft:#fff8c5;
  --up:#1a7f37; --up-soft:#dafbe1;
  --s1:#8250df; --s1b:#f3ebfd;
  --s2:#0969da; --s2b:#ddf4ff;
  --s3:#bc4c00; --s3b:#fff1e5;
  --s4:#1a7f37; --s4b:#dafbe1;
  --s5:#9a6700; --s5b:#fff8c5;
  --radius:12px;
  --shadow:0 1px 2px rgba(31,35,40,.06),0 3px 10px rgba(31,35,40,.05);
  --shadow-h:0 4px 12px rgba(31,35,40,.10),0 12px 28px rgba(31,35,40,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:76px}
body{
  background:var(--bg);color:var(--text);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.6;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1240px;margin:0 auto;padding:0 20px}

/* ---------- HERO ---------- */
.hero{
  position:relative;overflow:hidden;
  background:linear-gradient(135deg,#1f2328 0%,#2d333b 45%,#1c2b3a 100%);
  color:#fff;padding:52px 0 44px;
}
.hero::before{
  content:"";position:absolute;inset:0;
  background:radial-gradient(760px 320px at 12% -10%,rgba(88,166,255,.30),transparent 60%),
             radial-gradient(620px 300px at 88% 110%,rgba(163,113,247,.26),transparent 60%);
}
.hero .wrap{position:relative}
.brand{display:flex;align-items:center;gap:12px;margin-bottom:18px}
.brand svg{width:34px;height:34px;fill:#fff;flex:none}
.brand-t{font-size:14px;letter-spacing:.14em;text-transform:uppercase;color:rgba(255,255,255,.72);font-weight:600}
h1{font-size:clamp(26px,4.4vw,40px);line-height:1.22;font-weight:800;letter-spacing:-.02em;margin-bottom:12px}
h1 em{font-style:normal;background:linear-gradient(90deg,#79c0ff,#d2a8ff);-webkit-background-clip:text;background-clip:text;color:transparent}
.hero-meta{display:flex;flex-wrap:wrap;gap:10px 18px;color:rgba(255,255,255,.80);font-size:14px;margin-bottom:26px}
.hero-meta span{display:inline-flex;align-items:center;gap:6px}
.dot{width:7px;height:7px;border-radius:50%;background:#3fb950;box-shadow:0 0 0 4px rgba(63,185,80,.20)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:12px;margin-bottom:26px}
.kpi{background:rgba(255,255,255,.08);border:1px solid rgba(255,255,255,.14);border-radius:var(--radius);padding:16px 18px;backdrop-filter:blur(6px)}
.kpi .n{font-size:30px;font-weight:800;line-height:1.1;letter-spacing:-.02em}
.kpi .l{font-size:12.5px;color:rgba(255,255,255,.70);margin-top:4px}
.kpi.main{background:linear-gradient(135deg,rgba(88,166,255,.26),rgba(163,113,247,.20));border-color:rgba(121,192,255,.34)}

.sectionbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(132px,1fr));gap:10px}
.sb{
  display:flex;flex-direction:column;gap:6px;padding:12px 14px;border-radius:10px;
  background:rgba(255,255,255,.06);border:1px solid rgba(255,255,255,.12);
  text-decoration:none;color:#fff;transition:.18s;
}
.sb:hover{background:rgba(255,255,255,.13);transform:translateY(-2px)}
.sb .sbtop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sb .sbn{font-size:20px;font-weight:800}
.sb .sbl{font-size:12.5px;color:rgba(255,255,255,.76);line-height:1.35}
.sb .bar{height:3px;border-radius:2px;background:rgba(255,255,255,.22);overflow:hidden}
.sb .bar i{display:block;height:100%;border-radius:2px}

/* ---------- NAV ---------- */
nav{position:sticky;top:0;z-index:50;background:rgba(255,255,255,.88);backdrop-filter:blur(12px);border-bottom:1px solid var(--border)}
.navin{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.navin::-webkit-scrollbar{display:none}
.navin a{
  flex:none;display:inline-flex;align-items:center;gap:7px;
  padding:7px 14px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface);color:var(--text-2);text-decoration:none;
  font-size:13.5px;font-weight:600;white-space:nowrap;transition:.16s;
}
.navin a:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.navin a .c{font-size:11.5px;padding:1px 7px;border-radius:999px;background:var(--surface-2);color:var(--text-3)}
.navin a:hover .c{background:#fff;color:var(--accent)}
.navin a .pip{width:8px;height:8px;border-radius:3px}

/* ---------- SECTIONS ---------- */
main{padding:34px 0 10px}
section{margin-bottom:44px;scroll-margin-top:76px}
.shead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.shead .idx{
  width:30px;height:30px;border-radius:9px;display:grid;place-items:center;
  font-size:13px;font-weight:800;flex:none;
}
.shead h2{font-size:21px;font-weight:750;letter-spacing:-.01em}
.shead .cnt{font-size:13px;color:var(--text-3);font-weight:600;padding:2px 10px;border-radius:999px;background:var(--surface-2)}
.sdesc{color:var(--text-2);font-size:14px;margin:0 0 18px 42px}
.rule{height:1px;background:var(--border-soft);margin-bottom:18px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(330px,1fr));gap:16px}

.card{
  position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:18px 18px 16px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:11px;transition:.18s;overflow:hidden;
}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;opacity:.85}
.card:hover{transform:translateY(-3px);box-shadow:var(--shadow-h);border-color:#c2cbd5}
.ctop{display:flex;align-items:flex-start;gap:11px}
.num{
  flex:none;min-width:30px;height:26px;padding:0 8px;border-radius:7px;
  display:grid;place-items:center;font-size:12.5px;font-weight:800;
  font-variant-numeric:tabular-nums;letter-spacing:.02em;
}
.ttl{font-size:15.5px;font-weight:700;line-height:1.4;letter-spacing:-.01em;word-break:break-word}
.ttl .own{color:var(--text-3);font-weight:600}
.ttl a{color:inherit;text-decoration:none}
.ttl a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.hot{position:absolute;top:14px;right:14px;font-size:10.5px;font-weight:800;letter-spacing:.06em;color:#bc4c00;background:#fff1e5;border:1px solid #ffd8b5;padding:2px 7px;border-radius:6px}

.sum{font-size:13.8px;color:var(--text-2);line-height:1.72;flex:1}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:11.5px;font-weight:600;
  padding:3px 9px;border-radius:999px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text-2);white-space:nowrap;
}
.chip .lg{width:8px;height:8px;border-radius:50%;flex:none}
.chip.star{background:var(--star-soft);border-color:#f0e08a;color:#7d5f00}
.chip.up{background:var(--up-soft);border-color:#aceebb;color:var(--up)}
.chip.src{background:var(--accent-soft);border-color:#b6e3ff;color:#0550ae}

.cbot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:11px;border-top:1px dashed var(--border-soft)}
.go{
  display:inline-flex;align-items:center;gap:6px;font-size:12.5px;font-weight:700;
  color:var(--accent);text-decoration:none;padding:5px 11px;border-radius:7px;
  border:1px solid var(--border);background:var(--surface);transition:.16s;
}
.go:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.go svg{width:13px;height:13px;fill:currentColor}
.forks{font-size:11.5px;color:var(--text-3);font-variant-numeric:tabular-nums}

/* ---------- FOOTER ---------- */
footer{border-top:1px solid var(--border);background:var(--surface);margin-top:26px;padding:30px 0 44px}
.fgrid{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-start}
.fnote{font-size:13px;color:var(--text-2);line-height:1.85;max-width:640px}
.fnote strong{color:var(--text);font-weight:700}
.fstat{display:flex;gap:10px;flex-wrap:wrap}
.fstat div{background:var(--surface-2);border:1px solid var(--border-soft);border-radius:9px;padding:9px 14px;font-size:12.5px;color:var(--text-2)}
.fstat b{display:block;font-size:17px;color:var(--text);font-weight:800}
.fsrc{margin-top:16px;font-size:12px;color:var(--text-3)}
.fsrc a{color:var(--accent);text-decoration:none}
.fsrc a:hover{text-decoration:underline}

.top{
  position:fixed;right:20px;bottom:22px;width:42px;height:42px;border-radius:50%;
  background:var(--surface);border:1px solid var(--border);box-shadow:var(--shadow-h);
  display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:.22s;z-index:60;
}
.top.on{opacity:1;pointer-events:auto}
.top:hover{background:var(--accent);border-color:var(--accent)}
.top svg{width:17px;height:17px;fill:var(--text-2)}
.top:hover svg{fill:#fff}

@media (max-width:760px){
  .hero{padding:38px 0 34px}
  .kpi .n{font-size:24px}
  .grid{grid-template-columns:1fr}
  .sdesc{margin-left:0}
  main{padding:24px 0 10px}
}
</style>
</head>
<body>

<header class="hero" id="top">
  <div class="wrap">
    <div class="brand">
      <svg viewBox="0 0 16 16" aria-hidden="true"><path d="M8 0C3.58 0 0 3.58 0 8c0 3.54 2.29 6.53 5.47 7.59.4.07.55-.17.55-.38 0-.19-.01-.82-.01-1.49-2.01.37-2.53-.49-2.69-.94-.09-.23-.48-.94-.82-1.13-.28-.15-.68-.52-.01-.53.63-.01 1.08.58 1.23.82.72 1.21 1.87.87 2.33.66.07-.52.28-.87.51-1.07-1.78-.2-3.64-.89-3.64-3.95 0-.87.31-1.59.82-2.15-.08-.2-.36-1.02.08-2.12 0 0 .67-.21 2.2.82.64-.18 1.32-.27 2-.27.68 0 1.36.09 2 .27 1.53-1.04 2.2-.82 2.2-.82.44 1.1.16 1.92.08 2.12.51.56.82 1.27.82 2.15 0 3.07-1.87 3.75-3.65 3.95.29.25.54.73.54 1.48 0 1.07-.01 1.93-.01 2.2 0 .21.15.46.55.38A8.01 8.01 0 0 0 16 8c0-4.42-3.58-8-8-8Z"/></svg>
      <div class="brand-t">{{KICKER}}</div>
    </div>
    <h1>{{HEADLINE}}</h1>
    <div class="hero-meta">
      <span><i class="dot"></i><b id="heroDate">—</b></span>
      <span>数据抓取于 <b id="heroTime">—</b></span>
      <span>榜单口径：<b>{{SCOPE}}</b></span>
    </div>

    <div class="kpis">
      <div class="kpi main"><div class="n" id="kTotal">0</div><div class="l">今日收录仓库总数</div></div>
      <div class="kpi"><div class="n" id="kStars">0</div><div class="l">今日新增 Star 合计</div></div>
      <div class="kpi"><div class="n" id="kTop">—</div><div class="l">单日涨星冠军</div></div>
      <div class="kpi"><div class="n" id="kLang">0</div><div class="l">覆盖编程语言数</div></div>
      <div class="kpi"><div class="n">5</div><div class="l">固定版块</div></div>
    </div>

    <div class="sectionbar" id="sectionBar"></div>
  </div>
</header>

<nav><div class="wrap"><div class="navin" id="nav"></div></div></nav>

<main class="wrap" id="main"></main>

<footer>
  <div class="wrap">
    <div class="fgrid">
      <div class="fnote">
        本期共收录 <strong id="fTotal">0</strong> 个条目，{{FOOTER_NOTE}}
      </div>
      <div class="fstat">
        <div><b id="fRepos">0</b>仓库数</div>
        <div><b id="fStars">0</b>今日涨星</div>
        <div><b id="fLangs">0</b>语言</div>
      </div>
    </div>
    <div class="fsrc">
      数据源：{{SOURCE_HTML}}
      　·　生成时间：<span id="fTime">—</span>　·　全部时间均为北京时间（UTC+8）
    </div>
  </div>
</footer>

<div class="top" id="toTop" title="回到顶部"><svg viewBox="0 0 16 16"><path d="M8 3.5 2.5 9l1.06 1.06L8 5.62l4.44 4.44L13.5 9 8 3.5Z"/></svg></div>

<script>
const CAPTURED_AT = "{{CAPTURED_AT}}";

const SECTIONS = {{SECTIONS}};

const LANG_COLOR = {
  "Python":"#3572A5","TypeScript":"#3178c6","JavaScript":"#f1e05a","Rust":"#dea584","Go":"#00ADD8",
  "Java":"#b07219","C++":"#f34b7d","C":"#555555","C#":"#178600","Jupyter Notebook":"#DA5B0B","Other":"#8b949e"
};
const DATA = {{DATA}};

/* ---------- 时间：ISO -> 北京时间人话 ---------- */
const WD = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function bj(iso){
  const t = new Date(iso);
  const p = new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",year:"numeric",month:"numeric",
    day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false,weekday:"short"}).formatToParts(t);
  const g = k => (p.find(x=>x.type===k)||{}).value || "";
  const wd = WD[new Date(t.toLocaleString("en-US",{timeZone:"Asia/Shanghai"})).getDay()];
  const h = parseInt(g("hour"),10);
  const period = h<5?"凌晨":h<9?"清晨":h<12?"上午":h<14?"中午":h<18?"下午":h<23?"晚上":"深夜";
  return {
    date:`${g("year")} 年 ${g("month")} 月 ${g("day")} 日 · ${wd}`,
    time:`${period} ${h}:${g("minute")}`,
    full:`${g("year")} 年 ${g("month")} 月 ${g("day")} 日 ${wd} ${period} ${h}:${g("minute")}（北京时间）`
  };
}
const fmt = n => n.toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- 分组 + 全局连续编号 ---------- */
const groups = SECTIONS.map(sec=>({
  ...sec,
  items: DATA.filter(d=>d.s===sec.id).sort((a,b)=>b.today-a.today)
}));
let seq = 0;
groups.forEach(g=>g.items.forEach(it=>{ it.no = ++seq; }));

const TOTAL   = seq;
const SUMSTAR = DATA.reduce((a,b)=>a+b.today,0);
const LANGS   = [...new Set(DATA.map(d=>d.lang))];
const TOP     = [...DATA].sort((a,b)=>b.today-a.today)[0];
const MAXSEC  = Math.max(...groups.map(g=>g.items.length));

/* ---------- Hero ---------- */
const T = bj(CAPTURED_AT);
document.getElementById("heroDate").textContent = T.date;
document.getElementById("heroTime").textContent = T.time;
document.getElementById("kTotal").textContent = TOTAL;
document.getElementById("kStars").textContent = "+" + fmt(SUMSTAR);
document.getElementById("kTop").textContent   = "+" + fmt(TOP.today);
document.getElementById("kTop").parentElement.querySelector(".l").textContent = "单日涨星冠军 · " + TOP.repo.split("/")[1];
document.getElementById("kLang").textContent  = LANGS.length;

document.getElementById("sectionBar").innerHTML = groups.map(g=>`
  <a class="sb" href="#${g.id}">
    <div class="sbtop"><span class="sbn">${g.items.length}</span></div>
    <div class="sbl">${g.name}</div>
    <div class="bar"><i style="width:${Math.round(g.items.length/MAXSEC*100)}%;background:${g.color==="var(--s1)"?"#d2a8ff":g.color==="var(--s2)"?"#79c0ff":g.color==="var(--s3)"?"#ffa657":g.color==="var(--s4)"?"#7ee787":"#e3b341"}"></i></div>
  </a>`).join("");

/* ---------- 锚点导航 ---------- */
document.getElementById("nav").innerHTML =
  `<a href="#top"><span class="pip" style="background:#1f2328"></span>回到顶部</a>` +
  groups.map(g=>`<a href="#${g.id}"><span class="pip" style="background:${g.color}"></span>${g.name}<span class="c">${g.items.length}</span></a>`).join("");

/* ---------- 正文卡片 ---------- */
document.getElementById("main").innerHTML = groups.map(g=>`
  <section id="${g.id}">
    <div class="shead">
      <div class="idx" style="background:${g.bg};color:${g.color}">${g.icon}</div>
      <h2>${g.name}</h2>
      <span class="cnt">${g.items.length} 条</span>
    </div>
    <p class="sdesc">${g.desc}</p>
    <div class="rule"></div>
    <div class="grid">
      ${g.items.map(it=>{
        const owner = it.repo.split("/")[0], name = it.repo.split("/")[1];
        const lc = LANG_COLOR[it.lang] || LANG_COLOR.Other;
        const hot = it.today >= 400;
        return `
        <article class="card" style="--c:${g.color}">
          <div style="position:absolute;left:0;top:0;bottom:0;width:3px;background:${g.color};opacity:.8"></div>
          ${hot?'<span class="hot">HOT</span>':''}
          <div class="ctop">
            <span class="num" style="background:${g.bg};color:${g.color}">${String(it.no).padStart(2,"0")}</span>
            <h3 class="ttl"><a href="https://github.com/${it.repo}" target="_blank" rel="noopener noreferrer"><span class="own">${esc(owner)} /</span> ${esc(name)}</a></h3>
          </div>
          <p class="sum">${esc(it.sum)}</p>
          <div class="chips">
            <span class="chip"><i class="lg" style="background:${lc}"></i>${esc(it.lang)}</span>
            <span class="chip src">${esc(it.src)}</span>
            <span class="chip star">★ ${fmt(it.stars)}</span>
            <span class="chip up">今日 +${fmt(it.today)}</span>
          </div>
          <div class="cbot">
            <span class="forks">Fork ${fmt(it.forks)}</span>
            <a class="go" href="https://github.com/${it.repo}" target="_blank" rel="noopener noreferrer">
              查看仓库<svg viewBox="0 0 16 16"><path d="M3.75 2h3.5a.75.75 0 0 1 0 1.5h-3.5a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25v-3.5a.75.75 0 0 1 1.5 0v3.5A1.75 1.75 0 0 1 12.25 14h-8.5A1.75 1.75 0 0 1 2 12.25v-8.5C2 2.784 2.784 2 3.75 2Zm6.5-1h4a.75.75 0 0 1 .75.75v4a.75.75 0 0 1-1.5 0V3.56L8.28 8.78a.75.75 0 0 1-1.06-1.06L12.44 2.5h-2.19a.75.75 0 0 1 0-1.5Z"/></svg>
            </a>
          </div>
        </article>`;
      }).join("")}
    </div>
  </section>`).join("");

/* ---------- 页脚 ---------- */
document.getElementById("fTotal").textContent = TOTAL;
document.getElementById("fRepos").textContent = TOTAL;
document.getElementById("fStars").textContent = "+" + fmt(SUMSTAR);
document.getElementById("fLangs").textContent = LANGS.length;
document.getElementById("fTime").textContent  = T.full;
document.title = `{{DOC_TITLE_PREFIX}} · ${T.date.split(" · ")[0]}`;

/* ---------- 回到顶部 ---------- */
const btnTop = document.getElementById("toTop");
btnTop.addEventListener("click", ()=>window.scrollTo({top:0,behavior:"smooth"}));
addEventListener("scroll", ()=>btnTop.classList.toggle("on", scrollY>500), {passive:true});
</script>
</body>
</html>
