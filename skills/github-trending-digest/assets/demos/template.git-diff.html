<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
:root{
  --bg:#0d1117; --surface:#161b22; --surface-2:#1c2128;
  --border:#30363d; --border-soft:#21262d;
  --text:#c9d1d9; --text-2:#8b949e; --text-3:#6e7681;
  --add:#3fb950; --add-soft:#0f2f1c;
  --del:#f85149; --del-soft:#3f1412;
  --accent:#58a6ff; --accent-soft:#0d2d5c;
  --s1:#a371f7; --s1b:#271845;
  --s2:#58a6ff; --s2b:#0d2d5c;
  --s3:#f0883e; --s3b:#3d1d0a;
  --s4:#3fb950; --s4b:#0f2f1c;
  --s5:#d29922; --s5b:#2d1f00;
  --radius:6px;
  --shadow:0 0 0 1px var(--border);
  --mono:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{
  background:var(--bg);color:var(--text);
  font-family:var(--mono);line-height:1.55;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:1200px;margin:0 auto;padding:0 22px}

/* ---------- COMMIT HERO ---------- */
.hero{
  background:var(--surface);border-bottom:1px solid var(--border);padding:40px 0 32px;
}
.commit-box{
  border:1px solid var(--border);border-radius:var(--radius);background:var(--bg);overflow:hidden;
}
.commit-head{
  display:flex;align-items:center;gap:12px;padding:14px 18px;background:var(--surface-2);border-bottom:1px solid var(--border);flex-wrap:wrap
}
.commit-head .hash{
  font-family:var(--mono);font-size:12px;color:var(--text-3);background:var(--surface);border:1px solid var(--border);border-radius:4px;padding:3px 8px
}
.commit-head .msg{font-size:15px;font-weight:700;color:var(--text);flex:1}
.commit-head .meta{font-size:12px;color:var(--text-2);white-space:nowrap}
.commit-body{padding:18px 20px}
.kicker{
  display:inline-flex;align-items:center;gap:8px;font-size:12px;color:var(--text-2);margin-bottom:12px;letter-spacing:.04em
}
.kicker::before{content:"";display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--add)}
h1{font-size:clamp(24px,4.5vw,36px);font-weight:800;line-height:1.2;margin-bottom:14px;color:#fff}
h1 em{font-style:normal;color:var(--add)}

.hero-meta{display:flex;flex-wrap:wrap;gap:10px 18px;color:var(--text-2);font-size:13px;margin-bottom:24px}
.hero-meta span{display:inline-flex;align-items:center;gap:6px}
.hero-meta b{color:var(--text)}

.kpis{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:12px;margin-bottom:18px}
.kpi{
  background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:14px 16px;
  display:flex;flex-direction:column;gap:5px;justify-content:center
}
.kpi .sign{font-size:18px;font-weight:800;color:var(--add);line-height:1}
.kpi .n{font-size:26px;font-weight:800;line-height:1;color:#fff}
.kpi .l{font-size:11px;color:var(--text-2);line-height:1.4}
.kpi.main{background:var(--add-soft);border-color:rgba(63,185,80,.35)}

.sectionbar{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px}
.sb{
  display:flex;flex-direction:column;gap:5px;padding:12px 14px;border-radius:var(--radius);
  background:var(--surface-2);border:1px solid var(--border);text-decoration:none;color:var(--text-2);transition:.18s;
}
.sb:hover{background:var(--surface);border-color:var(--accent);color:var(--text)}
.sb .sbtop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sb .sbn{font-size:22px;font-weight:800;color:var(--add)}
.sb .sbl{font-size:12.5px;color:var(--text-2);line-height:1.35}
.sb .bar{height:2px;border-radius:2px;background:var(--border);overflow:hidden;margin-top:6px}
.sb .bar i{display:block;height:100%;border-radius:2px}

/* ---------- NAV ---------- */
nav{position:sticky;top:0;z-index:50;background:rgba(13,17,23,.92);backdrop-filter:blur(10px);border-bottom:1px solid var(--border)}
.navin{display:flex;gap:8px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.navin::-webkit-scrollbar{display:none}
.navin a{
  flex:none;display:inline-flex;align-items:center;gap:7px;
  padding:7px 14px;border-radius:var(--radius);border:1px solid var(--border);
  background:var(--surface-2);color:var(--text-2);text-decoration:none;
  font-size:13px;font-weight:600;white-space:nowrap;transition:.16s;
}
.navin a:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.navin a .c{font-family:var(--mono);font-size:11px;padding:1px 7px;border-radius:4px;background:var(--surface);color:var(--text-3)}
.navin a:hover .c{background:var(--accent);color:#fff}
.navin a .pip{width:8px;height:8px;border-radius:3px}

/* ---------- MAIN ---------- */
main{padding:34px 0 10px}
section{margin-bottom:44px;scroll-margin-top:90px}
.shead{display:flex;align-items:center;gap:12px;margin-bottom:6px}
.shead .idx{
  width:30px;height:30px;border-radius:var(--radius);display:grid;place-items:center;
  font-size:13px;font-weight:800;flex:none;font-family:var(--mono);
}
.shead h2{font-size:20px;font-weight:700;letter-spacing:-.01em;color:#fff}
.shead .cnt{font-family:var(--mono);font-size:12px;color:var(--text-3);font-weight:600;padding:2px 10px;border-radius:4px;background:var(--surface-2);border:1px solid var(--border)}
.sdesc{color:var(--text-2);font-size:13px;margin:0 0 18px 42px}
.rule{height:1px;background:var(--border);margin-bottom:18px}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}

.card{
  position:relative;background:var(--surface);border:1px solid var(--border);
  border-radius:var(--radius);padding:0;box-shadow:var(--shadow);
  display:flex;flex-direction:column;overflow:hidden;transition:.18s;
}
.card:hover{border-color:var(--accent);transform:translateY(-2px)}
.card::before{content:"";position:absolute;left:0;top:0;bottom:0;width:3px;background:var(--c);opacity:.8}
.filebar{
  display:flex;align-items:center;gap:10px;padding:10px 14px;background:var(--surface-2);border-bottom:1px solid var(--border);font-size:12px;color:var(--text-2)
}
.filebar .plus{color:var(--add);font-weight:800}
.filebar .path{color:#fff;font-weight:700;flex:1;word-break:break-all}
.filebar .meta{color:var(--text-3);font-family:var(--mono);font-size:11px}
.cardbody{padding:14px 16px 16px;display:flex;flex-direction:column;gap:11px;flex:1}
.ctop{display:flex;align-items:flex-start;gap:10px}
.num{
  flex:none;min-width:30px;height:26px;padding:0 8px;border-radius:4px;
  display:grid;place-items:center;font-size:12px;font-weight:800;
  font-family:var(--mono);letter-spacing:.02em;background:var(--surface-2);color:var(--text-3);
  border:1px solid var(--border)
}
.ttl{font-size:15px;font-weight:700;line-height:1.4;letter-spacing:-.01em;word-break:break-word}
.ttl .own{color:var(--text-3);font-weight:600}
.ttl a{color:inherit;text-decoration:none}
.ttl a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.hot{position:absolute;top:10px;right:10px;font-family:var(--mono);font-size:10px;font-weight:800;letter-spacing:.06em;color:#fff;background:var(--add);padding:2px 7px;border-radius:4px}

.sum{font-size:13.5px;color:var(--text-2);line-height:1.7;flex:1}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:2px 8px;border-radius:4px;border:1px solid var(--border);
  background:var(--surface-2);color:var(--text-2);white-space:nowrap;
}
.chip .lg{width:8px;height:8px;border-radius:50%;flex:none}
.chip.star{background:var(--s5b);border-color:rgba(210,153,34,.4);color:#d29922}
.chip.up{background:var(--add-soft);border-color:rgba(63,185,80,.4);color:var(--add)}
.chip.src{background:var(--accent-soft);border-color:rgba(88,166,255,.4);color:var(--accent)}

.cbot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px dashed var(--border)}
.go{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  color:var(--accent);text-decoration:none;padding:5px 11px;border-radius:4px;
  border:1px solid var(--border);background:var(--surface-2);transition:.16s;
}
.go:hover{background:var(--accent);border-color:var(--accent);color:#fff}
.go svg{width:13px;height:13px;fill:currentColor}
.forks{font-family:var(--mono);font-size:11px;color:var(--text-3)}

.diff-hint{
  display:flex;align-items:center;gap:8px;font-size:12px;color:var(--text-3);margin-top:4px
}
.diff-hint .line{height:2px;flex:1;background:var(--border-soft)}

/* ---------- FOOTER ---------- */
footer{border-top:1px solid var(--border);background:var(--surface);margin-top:26px;padding:30px 0 44px}
.fgrid{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-start}
.fnote{font-size:13px;color:var(--text-2);line-height:1.85;max-width:640px}
.fnote strong{color:#fff;font-weight:700}
.fstat{display:flex;gap:10px;flex-wrap:wrap}
.fstat div{background:var(--surface-2);border:1px solid var(--border);border-radius:var(--radius);padding:9px 14px;font-size:12px;color:var(--text-2)}
.fstat b{display:block;font-family:var(--mono);font-size:17px;color:#fff;font-weight:800}
.fsrc{margin-top:16px;font-size:12px;color:var(--text-3)}
.fsrc a{color:var(--accent);text-decoration:none}
.fsrc a:hover{text-decoration:underline}

.top{
  position:fixed;right:20px;bottom:22px;width:42px;height:42px;border-radius:50%;
  background:var(--surface-2);border:1px solid var(--border);box-shadow:var(--shadow);
  display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:.22s;z-index:60;
}
.top.on{opacity:1;pointer-events:auto}
.top:hover{background:var(--accent);border-color:var(--accent)}
.top svg{width:17px;height:17px;fill:var(--text-2)}
.top:hover svg{fill:#fff}

@media (max-width:760px){
  .hero{padding:28px 0 24px}
  .commit-head{padding:12px 14px}
  .commit-body{padding:14px 16px}
  .kpi .n{font-size:20px}
  .grid{grid-template-columns:1fr}
  .sdesc{margin-left:0}
  main{padding:24px 0 10px}
}
</style>
</head>
<body>

<header class="hero" id="top">
  <div class="wrap">
    <div class="commit-box">
      <div class="commit-head">
        <span class="hash" id="commitHash">loading…</span>
        <span class="msg">{{KICKER}}</span>
        <span class="meta">{{SCOPE}}</span>
      </div>
      <div class="commit-body">
        <div class="kicker"><span></span> {{KICKER}}</div>
        <h1>{{HEADLINE}}</h1>
        <div class="hero-meta">
          <span><b id="heroDate">—</b></span>
          <span>生成于 <b id="heroTime">—</b></span>
          <span>口径：<b>{{SCOPE}}</b></span>
        </div>

        <div class="kpis">
          <div class="kpi main"><span class="sign">+</span><div class="n" id="kTotal">0</div><div class="l">新增仓库</div></div>
          <div class="kpi"><span class="sign">+</span><div class="n" id="kStars">0</div><div class="l">今日 Star 增量</div></div>
          <div class="kpi"><span class="sign">+</span><div class="n" id="kTop">—</div><div class="l">最大增量</div></div>
          <div class="kpi"><span class="sign">+</span><div class="n" id="kLang">0</div><div class="l">覆盖语言</div></div>
          <div class="kpi"><span class="sign">+</span><div class="n">5</div><div class="l">变更文件</div></div>
        </div>

        <div class="sectionbar" id="sectionBar"></div>
      </div>
    </div>
  </div>
</header>

<nav><div class="wrap"><div class="navin" id="nav"></div></div></nav>

<main class="wrap" id="main"></main>

<footer>
  <div class="wrap">
    <div class="fgrid">
      <div class="fnote">
        本期共收录 <strong id="fTotal">0</strong> 个条目，{{FOOTER_NOTE}}
      </div>
      <div class="fstat">
        <div><b id="fRepos">0</b>仓库数</div>
        <div><b id="fStars">0</b>今日涨星</div>
        <div><b id="fLangs">0</b>语言</div>
      </div>
    </div>
    <div class="fsrc">
      数据源：{{SOURCE_HTML}}
      　·　生成时间：<span id="fTime">—</span>　·　全部时间均为北京时间（UTC+8）
    </div>
  </div>
</footer>

<div class="top" id="toTop" title="回到顶部"><svg viewBox="0 0 16 16"><path d="M8 3.5 2.5 9l1.06 1.06L8 5.62l4.44 4.44L13.5 9 8 3.5Z"/></svg></div>

<script>
const CAPTURED_AT = "{{CAPTURED_AT}}";

const SECTIONS = {{SECTIONS}};

const LANG_COLOR = {
  "Python":"#3572A5","TypeScript":"#3178c6","JavaScript":"#f1e05a","Rust":"#dea584","Go":"#00ADD8",
  "Java":"#b07219","C++":"#f34b7d","C":"#555555","C#":"#178600","Jupyter Notebook":"#DA5B0B","Other":"#8b949e"
};
const DATA = {{DATA}};

/* ---------- 时间：ISO -> 北京时间人话 ---------- */
const WD = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function bj(iso){
  const t = new Date(iso);
  const p = new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",year:"numeric",month:"numeric",
    day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false,weekday:"short"}).formatToParts(t);
  const g = k => (p.find(x=>x.type===k)||{}).value || "";
  const wd = WD[new Date(t.toLocaleString("en-US",{timeZone:"Asia/Shanghai"})).getDay()];
  const h = parseInt(g("hour"),10);
  const period = h<5?"凌晨":h<9?"清晨":h<12?"上午":h<14?"中午":h<18?"下午":h<23?"晚上":"深夜";
  return {
    date:`${g("year")} 年 ${g("month")} 月 ${g("day")} 日 · ${wd}`,
    time:`${period} ${h}:${g("minute")}`,
    full:`${g("year")} 年 ${g("month")} 月 ${g("day")} 日 ${wd} ${period} ${h}:${g("minute")}（北京时间）`
  };
}
const fmt = n => n.toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- 分组 + 全局连续编号 ---------- */
const groups = SECTIONS.map(sec=>({
  ...sec,
  items: DATA.filter(d=>d.s===sec.id).sort((a,b)=>b.today-a.today)
}));
let seq = 0;
groups.forEach(g=>g.items.forEach(it=>{ it.no = ++seq; }));

const TOTAL   = seq;
const SUMSTAR = DATA.reduce((a,b)=>a+b.today,0);
const LANGS   = [...new Set(DATA.map(d=>d.lang))];
const TOP     = [...DATA].sort((a,b)=>b.today-a.today)[0];
const MAXSEC  = Math.max(...groups.map(g=>g.items.length));

/* ---------- Hero ---------- */
const T = bj(CAPTURED_AT);
const ch = CAPTURED_AT.replace(/[^0-9a-z]/gi,"").slice(0,12);
document.getElementById("commitHash").textContent = ch + " → trending";
document.getElementById("heroDate").textContent = T.date;
document.getElementById("heroTime").textContent = T.time;
document.getElementById("kTotal").textContent = TOTAL;
document.getElementById("kStars").textContent = fmt(SUMSTAR);
document.getElementById("kTop").textContent   = fmt(TOP.today);
document.getElementById("kLang").textContent  = LANGS.length;

document.getElementById("sectionBar").innerHTML = groups.map(g=>`
  <a class="sb" href="#${g.id}">
    <div class="sbtop"><span class="sbn">+${g.items.length}</span></div>
    <div class="sbl">${g.name}</div>
    <div class="bar"><i style="width:${Math.round(g.items.length/MAXSEC*100)}%;background:${g.color==="var(--s1)"?"#a371f7":g.color==="var(--s2)"?"#58a6ff":g.color==="var(--s3)"?"#f0883e":g.color==="var(--s4)"?"#3fb950":"#d29922"}"></i></div>
  </a>`).join("");

/* ---------- 锚点导航 ---------- */
document.getElementById("nav").innerHTML =
  `<a href="#top"><span class="pip" style="background:#fff"></span>README</a>` +
  groups.map(g=>`<a href="#${g.id}"><span class="pip" style="background:${g.color}"></span>${g.name}<span class="c">${g.items.length}</span></a>`).join("");

/* ---------- 正文卡片 ---------- */
document.getElementById("main").innerHTML = groups.map(g=>`
  <section id="${g.id}">
    <div class="shead">
      <div class="idx" style="background:${g.bg};color:${g.color};border:1px solid ${g.color}">${g.icon}</div>
      <h2>${g.name}</h2>
      <span class="cnt">${g.items.length} files</span>
    </div>
    <p class="sdesc">${g.desc}</p>
    <div class="rule"></div>
    <div class="grid">
      ${g.items.map(it=>{
        const owner = it.repo.split("/")[0], name = it.repo.split("/")[1];
        const lc = LANG_COLOR[it.lang] || LANG_COLOR.Other;
        const hot = it.today >= 400;
        return `
        <article class="card" style="--c:${g.color}">
          <div class="filebar">
            <span class="plus">+${fmt(it.today)}</span>
            <span class="path">${esc(owner)} / ${esc(name)}</span>
            <span class="meta">${esc(it.lang)}</span>
          </div>
          <div class="cardbody">
            ${hot?'<span class="hot">HOT</span>':''}
            <div class="ctop">
              <span class="num" style="background:${g.bg};color:${g.color};border-color:${g.color}">${String(it.no).padStart(2,"0")}</span>
              <h3 class="ttl"><a href="https://github.com/${it.repo}" target="_blank" rel="noopener noreferrer"><span class="own">${esc(owner)} /</span> ${esc(name)}</a></h3>
            </div>
            <p class="sum">${esc(it.sum)}</p>
            <div class="chips">
              <span class="chip"><i class="lg" style="background:${lc}"></i>${esc(it.lang)}</span>
              <span class="chip src">${esc(it.src)}</span>
              <span class="chip star">★ ${fmt(it.stars)}</span>
              <span class="chip up">+${fmt(it.today)} today</span>
            </div>
            <div class="cbot">
              <span class="forks">Fork ${fmt(it.forks)}</span>
              <a class="go" href="https://github.com/${it.repo}" target="_blank" rel="noopener noreferrer">
                查看 diff<svg viewBox="0 0 16 16"><path d="M3.75 2h3.5a.75.75 0 0 1 0 1.5h-3.5a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25v-3.5a.75.75 0 0 1 1.5 0v3.5A1.75 1.75 0 0 1 12.25 14h-8.5A1.75 1.75 0 0 1 2 12.25v-8.5C2 2.784 2.784 2 3.75 2Zm6.5-1h4a.75.75 0 0 1 .75.75v4a.75.75 0 0 1-1.5 0V3.56L8.28 8.78a.75.75 0 0 1-1.06-1.06L12.44 2.5h-2.19a.75.75 0 0 1 0-1.5Z"/></svg>
              </a>
            </div>
          </div>
        </article>`;
      }).join("")}
    </div>
  </section>`).join("");

/* ---------- 页脚 ---------- */
document.getElementById("fTotal").textContent = TOTAL;
document.getElementById("fRepos").textContent = TOTAL;
document.getElementById("fStars").textContent = "+" + fmt(SUMSTAR);
document.getElementById("fLangs").textContent = LANGS.length;
document.getElementById("fTime").textContent  = T.full;
document.title = `{{DOC_TITLE_PREFIX}} · ${T.date.split(" · ")[0]}`;

/* ---------- 回到顶部 ---------- */
const btnTop = document.getElementById("toTop");
btnTop.addEventListener("click", ()=>window.scrollTo({top:0,behavior:"smooth"}));
addEventListener("scroll", ()=>btnTop.classList.toggle("on", scrollY>500), {passive:true});
</script>
</body>
</html>
