<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>{{TITLE}}</title>
<style>
:root{
  --paper:#f4f0e6;
  --paper-2:#e9e2d3;
  --paper-3:#dcd4c3;
  --ink:#1a1714;
  --ink-2:#4a4540;
  --ink-3:#7c7469;
  --accent:#8b1e1e;
  --accent-soft:#f3e3e3;
  --rule:#c9bfb0;
  --rule-soft:#ddd6c8;
  --s1:#6b4c6d; --s1b:#ece3ed;
  --s2:#2b5a7c; --s2b:#e1ecf3;
  --s3:#a14d18; --s3b:#f5e6db;
  --s4:#3a6b3a; --s4b:#e0ecde;
  --s5:#7d6a1e; --s5b:#f3efd9;
  --radius:2px;
  --shadow:0 1px 0 rgba(26,23,20,.12), 0 4px 12px rgba(26,23,20,.08);
}
*{box-sizing:border-box;margin:0;padding:0}
html{scroll-behavior:smooth;scroll-padding-top:90px}
body{
  background:var(--paper);color:var(--ink);
  font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC","Hiragino Sans GB","Microsoft YaHei",sans-serif;
  line-height:1.65;-webkit-font-smoothing:antialiased;
}
.wrap{max-width:980px;margin:0 auto;padding:0 22px}

/* ---------- MASTHEAD ---------- */
.hero{
  background:var(--paper);padding:40px 0 28px;border-bottom:3px double var(--rule);
}
.masthead{text-align:center;margin-bottom:28px}
.masthead .kicker{font-size:12px;letter-spacing:.35em;text-transform:uppercase;color:var(--ink-3);font-weight:700;margin-bottom:8px}
.masthead h1{font-family:Georgia,"Noto Serif SC",serif;font-size:clamp(38px,7vw,64px);font-weight:900;line-height:1.05;letter-spacing:.02em;color:var(--ink);margin-bottom:8px}
.masthead h1 em{font-style:italic;color:var(--accent)}
.masthead .dateline{
  display:flex;justify-content:center;align-items:center;gap:16px;
  font-size:13.5px;color:var(--ink-2);border-top:1px solid var(--rule);border-bottom:1px solid var(--rule);
  padding:8px 0;margin-top:14px;flex-wrap:wrap
}
.masthead .dateline b{font-weight:700;color:var(--ink)}

/* ---------- HERO DECK ---------- */
.deck{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:14px;
  padding:18px 0 26px;border-bottom:1px solid var(--rule);margin-bottom:22px
}
.deck .card{
  background:var(--paper-2);border:1px solid var(--rule);padding:14px 16px;text-align:center;
  box-shadow:var(--shadow)
}
.deck .card.main{background:var(--accent-soft);border-color:#d4b8b8}
.deck .n{font-family:ui-monospace,SFMono-Regular,Consolas,"Liberation Mono",Menlo,monospace;font-size:26px;font-weight:800;line-height:1.1;color:var(--accent)}
.deck .card.main .n{color:var(--accent)}
.deck .l{font-size:12px;color:var(--ink-2);margin-top:5px;font-weight:600;letter-spacing:.02em}

/* ---------- SECTION BAR ---------- */
.sectionbar{
  display:grid;grid-template-columns:repeat(auto-fit,minmax(160px,1fr));gap:10px
}
.sb{
  display:flex;flex-direction:column;gap:5px;padding:12px 14px;border:1px solid var(--rule);
  background:var(--paper-2);text-decoration:none;color:var(--ink-2);transition:.18s;
}
.sb:hover{background:var(--paper-3);color:var(--ink)}
.sb .sbtop{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sb .sbn{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:22px;font-weight:800;color:var(--accent)}
.sb .sbl{font-size:12.5px;color:var(--ink-2);line-height:1.35;font-weight:600}
.sb .bar{height:2px;background:var(--rule);overflow:hidden;margin-top:6px}
.sb .bar i{display:block;height:100%;border-radius:1px}

/* ---------- NAV ---------- */
nav{position:sticky;top:0;z-index:50;background:rgba(244,240,230,.95);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.navin{display:flex;gap:10px;overflow-x:auto;padding:12px 0;scrollbar-width:none}
.navin::-webkit-scrollbar{display:none}
.navin a{
  flex:none;display:inline-flex;align-items:center;gap:7px;
  padding:6px 13px;border:1px solid var(--rule);border-radius:999px;
  background:var(--paper-2);color:var(--ink-2);text-decoration:none;
  font-size:13px;font-weight:600;white-space:nowrap;transition:.18s;
}
.navin a:hover{border-color:var(--accent);color:var(--accent);background:var(--accent-soft)}
.navin a .c{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;padding:1px 7px;border-radius:999px;background:var(--paper-3);color:var(--ink-2)}
.navin a:hover .c{background:var(--accent);color:#fff}
.navin a .pip{width:8px;height:8px;border-radius:3px}

/* ---------- MAIN ---------- */
main{padding:34px 0 10px}
section{margin-bottom:46px;scroll-margin-top:90px}
.shead{display:flex;align-items:baseline;gap:12px;margin-bottom:8px;border-bottom:2px solid var(--accent);padding-bottom:8px}
.shead .idx{
  font-family:Georgia,"Noto Serif SC",serif;font-size:20px;font-weight:700;color:var(--accent);
  width:30px;height:30px;border:2px solid var(--accent);border-radius:50%;display:grid;place-items:center;flex:none
}
.shead h2{font-family:Georgia,"Noto Serif SC",serif;font-size:22px;font-weight:700;letter-spacing:.02em}
.shead .cnt{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:12px;color:var(--ink-3);font-weight:700;padding:3px 10px;border:1px solid var(--rule);background:var(--paper-2);border-radius:999px}
.sdesc{color:var(--ink-2);font-size:14px;margin:0 0 20px 42px;font-style:italic}

.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:16px}

.card{
  position:relative;background:var(--paper-2);border:1px solid var(--rule);
  padding:17px 17px 15px;box-shadow:var(--shadow);
  display:flex;flex-direction:column;gap:11px;transition:.18s;overflow:hidden;
}
.card:hover{transform:translateY(-2px);box-shadow:0 4px 14px rgba(26,23,20,.12);border-color:var(--ink-3)}
.ctop{display:flex;align-items:flex-start;gap:11px}
.num{
  flex:none;min-width:30px;height:26px;padding:0 8px;border:1px solid var(--rule);
  display:grid;place-items:center;font-size:12px;font-weight:800;
  font-family:ui-monospace,SFMono-Regular,Consolas,monospace;letter-spacing:.02em;
  background:var(--paper-3);color:var(--ink-2);border-radius:2px
}
.ttl{font-size:15px;font-weight:700;line-height:1.45;letter-spacing:-.01em;word-break:break-word;font-family:Georgia,"Noto Serif SC",serif}
.ttl .own{color:var(--ink-3);font-weight:600;font-family:-apple-system,BlinkMacSystemFont,"Segoe UI","PingFang SC",sans-serif}
.ttl a{color:inherit;text-decoration:none}
.ttl a:hover{color:var(--accent);text-decoration:underline;text-underline-offset:3px}
.hot{position:absolute;top:12px;right:12px;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:10px;font-weight:800;letter-spacing:.08em;color:#fff;background:var(--accent);padding:2px 7px;border-radius:2px;transform:rotate(2deg)}

.sum{font-size:13.5px;color:var(--ink-2);line-height:1.75;flex:1}

.chips{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.chip{
  display:inline-flex;align-items:center;gap:5px;font-size:11px;font-weight:600;
  padding:2px 8px;border:1px solid var(--rule);border-radius:2px;
  background:var(--paper);color:var(--ink-2);white-space:nowrap;
}
.chip .lg{width:7px;height:7px;border-radius:50%;flex:none}
.chip.star{background:#f8f3d9;border-color:#e3d9b0;color:#6b5a1e}
.chip.up{background:#e3f0e3;border-color:#b8d6b8;color:#3a6b3a}
.chip.src{background:#e1ecf3;border-color:#bdd7e8;color:#2b5a7c}

.cbot{display:flex;align-items:center;justify-content:space-between;gap:10px;padding-top:12px;border-top:1px dashed var(--rule-soft)}
.go{
  display:inline-flex;align-items:center;gap:6px;font-size:12px;font-weight:700;
  color:var(--accent);text-decoration:none;padding:5px 11px;border-radius:2px;
  border:1px solid var(--accent);background:var(--paper);transition:.16s;
}
.go:hover{background:var(--accent);color:#fff}
.go svg{width:13px;height:13px;fill:currentColor}
.forks{font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:11px;color:var(--ink-3)}

/* ---------- FOOTER ---------- */
footer{border-top:3px double var(--rule);background:var(--paper-2);margin-top:30px;padding:32px 0 44px}
.fgrid{display:flex;flex-wrap:wrap;gap:20px;justify-content:space-between;align-items:flex-start}
.fnote{font-size:13px;color:var(--ink-2);line-height:1.85;max-width:640px}
.fnote strong{color:var(--ink);font-weight:700}
.fstat{display:flex;gap:10px;flex-wrap:wrap}
.fstat div{background:var(--paper);border:1px solid var(--rule);border-radius:2px;padding:9px 14px;font-size:12px;color:var(--ink-2)}
.fstat b{display:block;font-family:ui-monospace,SFMono-Regular,Consolas,monospace;font-size:17px;color:var(--accent);font-weight:800}
.fsrc{margin-top:16px;font-size:12px;color:var(--ink-3)}
.fsrc a{color:var(--accent);text-decoration:none}
.fsrc a:hover{text-decoration:underline}

.top{
  position:fixed;right:22px;bottom:22px;width:42px;height:42px;border-radius:50%;
  background:var(--paper-2);border:1px solid var(--rule);box-shadow:var(--shadow);
  display:grid;place-items:center;cursor:pointer;opacity:0;pointer-events:none;transition:.22s;z-index:60;
}
.top.on{opacity:1;pointer-events:auto}
.top:hover{background:var(--accent);border-color:var(--accent)}
.top svg{width:17px;height:17px;fill:var(--ink-2)}
.top:hover svg{fill:#fff}

@media (max-width:760px){
  .hero{padding:28px 0 22px}
  .masthead h1{font-size:34px}
  .deck{padding:14px 0 20px}
  .grid{grid-template-columns:1fr}
  .sdesc{margin-left:0}
  main{padding:24px 0 10px}
}
</style>
</head>
<body>

<header class="hero" id="top">
  <div class="wrap">
    <div class="masthead">
      <div class="kicker">{{KICKER}}</div>
      <h1>{{HEADLINE}}</h1>
      <div class="dateline">
        <span>北京 · <b id="heroDate">—</b></span>
        <span>第 <b id="heroIssue">—</b> 期</span>
        <span>编辑于 <b id="heroTime">—</b></span>
        <span>口径：<b>{{SCOPE}}</b></span>
      </div>
    </div>

    <div class="deck">
      <div class="card main"><div class="n" id="kTotal">0</div><div class="l">今日收录仓库</div></div>
      <div class="card"><div class="n" id="kStars">0</div><div class="l">新增 Star 合计</div></div>
      <div class="card"><div class="n" id="kTop">—</div><div class="l">涨星冠军</div></div>
      <div class="card"><div class="n" id="kLang">0</div><div class="l">覆盖语言数</div></div>
      <div class="card"><div class="n">5</div><div class="l">版面栏目</div></div>
    </div>

    <div class="sectionbar" id="sectionBar"></div>
  </div>
</header>

<nav><div class="wrap"><div class="navin" id="nav"></div></div></nav>

<main class="wrap" id="main"></main>

<footer>
  <div class="wrap">
    <div class="fgrid">
      <div class="fnote">
        本期共收录 <strong id="fTotal">0</strong> 个条目，{{FOOTER_NOTE}}
      </div>
      <div class="fstat">
        <div><b id="fRepos">0</b>仓库数</div>
        <div><b id="fStars">0</b>今日涨星</div>
        <div><b id="fLangs">0</b>语言</div>
      </div>
    </div>
    <div class="fsrc">
      数据来源：{{SOURCE_HTML}}
      　·　生成时间：<span id="fTime">—</span>　·　全部时间均为北京时间（UTC+8）
    </div>
  </div>
</footer>

<div class="top" id="toTop" title="回到顶部"><svg viewBox="0 0 16 16"><path d="M8 3.5 2.5 9l1.06 1.06L8 5.62l4.44 4.44L13.5 9 8 3.5Z"/></svg></div>

<script>
const CAPTURED_AT = "{{CAPTURED_AT}}";

const SECTIONS = {{SECTIONS}};

const LANG_COLOR = {
  "Python":"#3572A5","TypeScript":"#3178c6","JavaScript":"#f1e05a","Rust":"#dea584","Go":"#00ADD8",
  "Java":"#b07219","C++":"#f34b7d","C":"#555555","C#":"#178600","Jupyter Notebook":"#DA5B0B","Other":"#8b949e"
};
const DATA = {{DATA}};

/* ---------- 时间：ISO -> 北京时间人话 ---------- */
const WD = ["星期日","星期一","星期二","星期三","星期四","星期五","星期六"];
function bj(iso){
  const t = new Date(iso);
  const p = new Intl.DateTimeFormat("zh-CN",{timeZone:"Asia/Shanghai",year:"numeric",month:"numeric",
    day:"numeric",hour:"2-digit",minute:"2-digit",hour12:false,weekday:"short"}).formatToParts(t);
  const g = k => (p.find(x=>x.type===k)||{}).value || "";
  const wd = WD[new Date(t.toLocaleString("en-US",{timeZone:"Asia/Shanghai"})).getDay()];
  const h = parseInt(g("hour"),10);
  const period = h<5?"凌晨":h<9?"清晨":h<12?"上午":h<14?"中午":h<18?"下午":h<23?"晚上":"深夜";
  return {
    date:`${g("year")} 年 ${g("month")} 月 ${g("day")} 日 · ${wd}`,
    time:`${period} ${h}:${g("minute")}`,
    full:`${g("year")} 年 ${g("month")} 月 ${g("day")} 日 ${wd} ${period} ${h}:${g("minute")}（北京时间）`,
    issue:`${g("year")}${g("month").padStart(2,"0")}${g("day").padStart(2,"0")}`
  };
}
const fmt = n => n.toLocaleString("en-US");
const esc = s => String(s).replace(/[&<>"]/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c]));

/* ---------- 分组 + 全局连续编号 ---------- */
const groups = SECTIONS.map(sec=>({
  ...sec,
  items: DATA.filter(d=>d.s===sec.id).sort((a,b)=>b.today-a.today)
}));
let seq = 0;
groups.forEach(g=>g.items.forEach(it=>{ it.no = ++seq; }));

const TOTAL   = seq;
const SUMSTAR = DATA.reduce((a,b)=>a+b.today,0);
const LANGS   = [...new Set(DATA.map(d=>d.lang))];
const TOP     = [...DATA].sort((a,b)=>b.today-a.today)[0];
const MAXSEC  = Math.max(...groups.map(g=>g.items.length));

/* ---------- Hero ---------- */
const T = bj(CAPTURED_AT);
document.getElementById("heroDate").textContent = T.date;
document.getElementById("heroIssue").textContent = T.issue;
document.getElementById("heroTime").textContent = T.time;
document.getElementById("kTotal").textContent = TOTAL;
document.getElementById("kStars").textContent = "+" + fmt(SUMSTAR);
document.getElementById("kTop").textContent   = "+" + fmt(TOP.today);
document.getElementById("kLang").textContent  = LANGS.length;

document.getElementById("sectionBar").innerHTML = groups.map(g=>`
  <a class="sb" href="#${g.id}">
    <div class="sbtop"><span class="sbn">${g.items.length}</span></div>
    <div class="sbl">${g.name}</div>
    <div class="bar"><i style="width:${Math.round(g.items.length/MAXSEC*100)}%;background:${g.color==="var(--s1)"?"#9a7a9c":g.color==="var(--s2)"?"#6a9ab8":g.color==="var(--s3)"?"#c57a50":g.color==="var(--s4)"?"#6a9a6a":"#b9a85a"}"></i></div>
  </a>`).join("");

/* ---------- 锚点导航 ---------- */
document.getElementById("nav").innerHTML =
  `<a href="#top"><span class="pip" style="background:var(--accent)"></span>头版</a>` +
  groups.map(g=>`<a href="#${g.id}"><span class="pip" style="background:${g.color}"></span>${g.name}<span class="c">${g.items.length}</span></a>`).join("");

/* ---------- 正文卡片 ---------- */
document.getElementById("main").innerHTML = groups.map(g=>`
  <section id="${g.id}">
    <div class="shead">
      <div class="idx" style="color:${g.color};border-color:${g.color}">${g.icon}</div>
      <h2>${g.name}</h2>
      <span class="cnt">${g.items.length} 条</span>
    </div>
    <p class="sdesc">${g.desc}</p>
    <div class="grid">
      ${g.items.map(it=>{
        const owner = it.repo.split("/")[0], name = it.repo.split("/")[1];
        const lc = LANG_COLOR[it.lang] || LANG_COLOR.Other;
        const hot = it.today >= 400;
        return `
        <article class="card" style="--c:${g.color}">
          ${hot?'<span class="hot">HOT</span>':''}
          <div class="ctop">
            <span class="num" style="color:${g.color};background:${g.bg};border-color:${g.color}">${String(it.no).padStart(2,"0")}</span>
            <h3 class="ttl"><a href="https://github.com/${it.repo}" target="_blank" rel="noopener noreferrer"><span class="own">${esc(owner)} /</span> ${esc(name)}</a></h3>
          </div>
          <p class="sum">${esc(it.sum)}</p>
          <div class="chips">
            <span class="chip"><i class="lg" style="background:${lc}"></i>${esc(it.lang)}</span>
            <span class="chip src">${esc(it.src)}</span>
            <span class="chip star">★ ${fmt(it.stars)}</span>
            <span class="chip up">今日 +${fmt(it.today)}</span>
          </div>
          <div class="cbot">
            <span class="forks">Fork ${fmt(it.forks)}</span>
            <a class="go" href="https://github.com/${it.repo}" target="_blank" rel="noopener noreferrer">
              阅读全文<svg viewBox="0 0 16 16"><path d="M3.75 2h3.5a.75.75 0 0 1 0 1.5h-3.5a.25.25 0 0 0-.25.25v8.5c0 .138.112.25.25.25h8.5a.25.25 0 0 0 .25-.25v-3.5a.75.75 0 0 1 1.5 0v3.5A1.75 1.75 0 0 1 12.25 14h-8.5A1.75 1.75 0 0 1 2 12.25v-8.5C2 2.784 2.784 2 3.75 2Zm6.5-1h4a.75.75 0 0 1 .75.75v4a.75.75 0 0 1-1.5 0V3.56L8.28 8.78a.75.75 0 0 1-1.06-1.06L12.44 2.5h-2.19a.75.75 0 0 1 0-1.5Z"/></svg>
            </a>
          </div>
        </article>`;
      }).join("")}
    </div>
  </section>`).join("");

/* ---------- 页脚 ---------- */
document.getElementById("fTotal").textContent = TOTAL;
document.getElementById("fRepos").textContent = TOTAL;
document.getElementById("fStars").textContent = "+" + fmt(SUMSTAR);
document.getElementById("fLangs").textContent = LANGS.length;
document.getElementById("fTime").textContent  = T.full;
document.title = `{{DOC_TITLE_PREFIX}} · ${T.date.split(" · ")[0]}`;

/* ---------- 回到顶部 ---------- */
const btnTop = document.getElementById("toTop");
btnTop.addEventListener("click", ()=>window.scrollTo({top:0,behavior:"smooth"}));
addEventListener("scroll", ()=>btnTop.classList.toggle("on", scrollY>500), {passive:true});
</script>
</body>
</html>
