<!doctype html>
<html lang="zh-CN">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>干净样本：首屏与中间屏</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 16 16'%3E%3Crect width='16' height='16' fill='%23101418'/%3E%3C/svg%3E">
<style>
  :root { --bg: #101418; --fg: #f4f1ea; --accent: #d97757; }
  body { margin: 0; background: #101418; color: #f4f1ea; font-family: "Noto Serif SC", serif; }
  h1 { font-size: 64px; line-height: 1.1; }
  p { font-size: 16px; max-width: 38em; }
  main { padding: 8vh 8vw; display: grid; gap: 4vh; }
  @media (max-width: 700px) {
    h1 { font-size: 40px; }
    main { padding: 6vh 6vw; }
  }
</style>
</head>
<body>
<main>
  <h1>一句话说清这是什么</h1>
  <p>正文从小屏到桌面都能读，字号不缩水，颜色有对比，所有文字都已经换成真实内容。</p>
  <img src="data:image/svg+xml;base64,PHN2ZyB4bWxucz0iaHR0cDovL3d3dy53My5vcmcvMjAwMC9zdmciIHdpZHRoPSI0MDAiIGhlaWdodD0iMjAwIj48cmVjdCB3aWR0aD0iNDAwIiBoZWlnaHQ9IjIwMCIgZmlsbD0iI2Q5Nzc1NyIvPjwvc3ZnPg==" alt="示意图">
</main>
</body>
</html>
