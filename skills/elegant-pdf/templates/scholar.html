<!-- elegant-pdf template — classic scholar style -->
<!DOCTYPE html>
<html lang="{lang}">
<head>
<meta charset="UTF-8">
<title>{title}</title>
<style>
/* ===== Reset ===== */
body {{
    margin: 0; padding: 0;
    font-family: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", "Georgia", "Times New Roman", serif;
    font-size: 11pt; line-height: 1.5;
    color: #333; text-align: justify; text-align-last: left;
    string-set: doctitle "{running_title}";
}}

/* ===== Page ===== */
@page {{
    size: A4; margin: 2.5cm 2.5cm 2.5cm 2.5cm;
    @top-center {{
        content: string(doctitle);
        font-size: 9pt; color: #999; font-family: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "Georgia", serif;
    }}
    @bottom-center {{
        content: counter(page);
        font-size: 9pt; color: #999;
    }}
}}

@page cover {{
    margin: 0;
    @top-center {{ content: none; }}
    @bottom-center {{ content: none; }}
}}

@page toc {{
    @top-center {{ content: none; }}
}}

/* ===== Cover — pure white, centered text, single thin rule, no decoration ===== */
.cover {{
    page: cover; width: 210mm; height: 297mm; margin: 0;
    position: relative; overflow: hidden; page-break-after: always;
    background: #ffffff;
}}

.cover-content {{
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); text-align: center; width: 72%; z-index: 1;
}}

.cover-label {{
    font-size: 9.5pt; letter-spacing: 0.35em; color: #999;
    text-transform: uppercase; margin-bottom: 2.5cm; font-weight: 400;
}}

.cover-title {{
    font-family: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", "Georgia", serif;
    font-size: 30pt; font-weight: 400; color: #333;
    margin-bottom: 1cm; letter-spacing: 0.04em; line-height: 1.3;
    border: none !important; page-break-before: auto !important;
}}

.cover-divider {{
    width: 80px; height: 1px;
    background: #999;
    margin: 0 auto 1.2cm auto;
}}

.cover-subtitle {{
    font-size: 12pt; color: #777; font-weight: 400;
    margin-bottom: 3cm; letter-spacing: 0.06em;
}}

.cover-meta {{
    font-size: 9.5pt; color: #999; line-height: 2.2; letter-spacing: 0.05em;
}}

.cover-meta p {{ margin: 0.2em 0; }}

/* ===== TOC ===== */
.toc-page {{
    page: toc; page-break-after: always;
}}

.toc-title {{
    font-family: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", "Georgia", serif;
    font-size: 18pt; font-weight: 400; color: #333;
    text-align: center; margin-bottom: 1.5cm; margin-top: 0.5cm;
    letter-spacing: 0.1em;
}}

.toc-list {{
    list-style: none; padding: 0; margin: 0;
}}

.toc-list li {{
    margin-bottom: 0.5em;
}}

.toc-list a {{
    color: #333; text-decoration: none; display: block;
    padding: 0.3em 0; border-bottom: 0.5px solid #eee;
    font-size: 10.5pt;
}}

.toc-list a::after {{
    content: "      " target-counter(attr(href), page);
    /* leader(".") removed: WeasyPrint renders it as garbled chars */
    float: right; color: #999;
}}

.toc-l1 > a {{
    font-weight: 600; font-size: 11pt; color: #333;
    border-bottom-color: #ddd; margin-top: 0.6em;
}}

.toc-l2 {{
    padding-left: 1.5em; font-size: 10pt;
}}

/* ===== Headings ===== */
h1 {{
    font-family: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", "Georgia", serif;
    font-size: 18pt; font-weight: 400; color: #333;
    margin-top: 0; margin-bottom: 0.8cm;
    padding-top: 0.2cm; padding-bottom: 0.3cm;
    border-top: 1px solid #999;
    border-bottom: 0.5px solid #ccc;
    page-break-before: always; letter-spacing: 0.04em;
    string-set: doctitle content();
    counter-reset: theorem;
}}

body.cover-page h1:first-of-type {{
    page-break-before: auto;
}}

h2 {{
    font-family: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", "Georgia", serif;
    font-size: 13pt; font-weight: 600; color: #333;
    margin-top: 1cm; margin-bottom: 0.4cm; page-break-after: avoid;
}}

h3 {{
    font-family: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", "Georgia", serif;
    font-size: 11.5pt; font-weight: 600; color: #333;
    margin-top: 0.7cm; margin-bottom: 0.3cm; page-break-after: avoid;
}}

h4 {{
    font-family: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", "Georgia", serif;
    font-size: 10.5pt; font-weight: 600; color: #555;
    margin-top: 0.5cm; margin-bottom: 0.2cm;
}}

/* ===== Paragraphs ===== */
p {{
    margin: 0.4em 0; orphans: 2; widows: 2;
}}

/* ===== Blockquote ===== */
blockquote {{
    border-left: 3px solid #999;
    padding: 0.6em 1.2em; margin: 0.6cm 0;
    color: #555; font-size: 10.5pt; line-height: 1.6;
}}

blockquote p {{ margin: 0.2em 0; }}

/* ===== Intro block ===== */
.intro-block {{
    border-left: 3px solid #999;
    padding: 0.8em 1em; margin: 0.6cm 0;
    font-size: 10pt; color: #555; line-height: 1.6;
}}

/* ===== Quote box ===== */
.quote-box {{
    border-left: 2px solid #ccc;
    padding: 0.6em 1.2em; margin: 0.6cm 0;
    font-style: italic; color: #555; font-size: 10.5pt; line-height: 1.6;
}}

/* ===== Memo section ===== */
.memo-section {{
    border: 1px solid #ccc;
    padding: 0.8em 1em; margin: 0.6cm 0;
}}

.memo-title {{
    font-weight: 600; letter-spacing: 0.05em;
    margin: 0 0 0.4cm 0; color: #333; font-size: 10.5pt;
}}

/* ===== Section note ===== */
.section-note {{
    font-size: 9.5pt; color: #777;
    border-left: 2px solid #ccc;
    padding: 0.5em 1em; margin: 0.5cm 0; line-height: 1.6;
}}

/* ===== Theorem — auto-numbered, the signature scholar element ===== */
.theorem {{
    border-left: 3px solid #333;
    padding: 0.8em 1em; margin: 0.6cm 0;
}}

.theorem::before {{
    content: "定理 " counter(theorem) ".";
    counter-increment: theorem;
    display: block; font-weight: 600; color: #333;
    margin-bottom: 0.3em;
}}

/* ===== Code ===== */
code {{
    font-family: "Menlo", "Courier New", monospace;
    font-size: 9pt; background: #f5f5f5; padding: 0.15em 0.4em;
    color: #333;
}}

pre {{
    background: #f5f5f5; border: 1px solid #e5e5e5;
    padding: 0.8em 1em; margin: 0.5cm 0;
    font-size: 9pt; line-height: 1.5; overflow-x: auto;
    page-break-inside: avoid;
}}

pre code {{
    background: none; padding: 0;
}}

/* ===== Tables — Booktabs style ===== */
table {{
    width: 100%; max-width: 100%; border-collapse: collapse;
    margin: 0.6cm 0; font-size: 9.5pt; box-sizing: border-box;
}}

thead {{ display: table-header-group; }}

thead tr {{
    border-top: 2px solid #333;
    border-bottom: 1px solid #333;
}}

th {{
    padding: 0.5em 0.8em; text-align: left;
    font-weight: 600; color: #333;
}}

td {{
    padding: 0.5em 0.8em; text-align: left; vertical-align: top;
}}

th, td {{ overflow-wrap: anywhere; word-break: break-word; hyphens: auto; }}

tbody tr {{ border-bottom: 0.5px solid #eee; }}

tbody tr:last-child {{ border-bottom: 1.5px solid #333; }}

tr {{ page-break-inside: avoid; }}

/* ===== Lists ===== */
ul {{
    margin: 0.4em 0; padding-left: 2em;
    list-style-type: none;
}}

ol {{
    margin: 0.4em 0; padding-left: 2em;
    list-style-type: decimal;
}}

li {{ margin-bottom: 0.25em; }}

/* ===== Emphasis ===== */
strong {{ font-weight: 600; color: #333; }}
em {{ font-style: italic; color: #555; }}

/* ===== Horizontal rule ===== */
hr {{
    border: none; height: 0.5px;
    background: #ccc;
    margin: 0.8cm 0;
}}

/* ===== Links ===== */
a {{ word-break: break-all; color: #999; }}

/* ===== Images ===== */
img {{ max-width: 100%; height: auto; }}

/* ===== Page break helpers ===== */
figure, blockquote, table, pre {{
    page-break-inside: avoid;
}}
h1, h2, h3, h4 {{
    page-break-inside: avoid;
}}

/* ===== Overflow protection ===== */
pre, table, figure, img, svg, blockquote {{
    max-width: 100%; box-sizing: border-box;
}}
</style>
</head>
<body class="cover-page">

<!-- ===== Cover ===== -->
<div class="cover">
    <div class="cover-content">
        <div class="cover-label">{cover_label}</div>
        <h1 class="cover-title">{title}</h1>
        <div class="cover-divider"></div>
        <p class="cover-subtitle">{subtitle}</p>
        <div class="cover-meta">
            <p>{author_line}</p>
            <p>{date_line}</p>
        </div>
    </div>
</div>

<!-- ===== TOC ===== -->
<div class="toc-page">
    <div class="toc-title">目&ensp;录</div>
    <ul class="toc-list">
{toc_items}
    </ul>
</div>

<!-- ===== Body ===== -->
{body}

</body>
</html>
