<!-- elegant-pdf template — Bauhaus style -->
<!DOCTYPE html>
<html lang="{lang}">
<head>
<meta charset="UTF-8">
<title>{title}</title>
<style>
/* ===== Bauhaus ===== */
/* Design DNA: scattered primary geometry (red/blue/yellow) + bold black */
/* H1 yellow block, H2 red border, H3 blue text, black table headers + zebra */

/* ===== Reset ===== */
body {{
    margin: 0; padding: 0;
    font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 10pt; line-height: 1.55;
    color: #1a1a1a;
    text-align: justify; text-align-last: left;
    string-set: doctitle "{running_title}";
}}

/* ===== Page ===== */
@page {{
    size: A4; margin: 2cm 1.8cm 2cm 1.8cm;
    @top-center {{
        content: string(doctitle);
        font-size: 7pt; color: #999;
        font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", sans-serif;
        letter-spacing: 0.05em;
    }}
    @bottom-center {{
        content: counter(page);
        font-size: 10pt; color: #e63946; font-weight: 900;
    }}
}}

@page cover {{
    margin: 0;
    @top-center {{ content: none; }}
    @bottom-center {{ content: none; }}
}}

@page toc {{
    @top-center {{ content: none; }}
}}

/* ===== Cover — scattered primary geometry ===== */
.cover {{
    page: cover; width: 210mm; height: 297mm; margin: 0;
    position: relative; overflow: hidden; page-break-after: always;
    background: #ffffff;
}}

/* Geometric shapes */
.bh-circle-red {{
    position: absolute; top: 40mm; right: 25mm;
    width: 70mm; height: 70mm; background: #e63946; border-radius: 50%;
}}
.bh-rect-blue {{
    position: absolute; top: 90mm; left: 20mm;
    width: 55mm; height: 55mm; background: #2563eb;
}}
.bh-tri-yellow {{
    position: absolute; bottom: 60mm; right: 40mm;
    width: 0; height: 0;
    border-left: 35mm solid transparent;
    border-right: 35mm solid transparent;
    border-bottom: 60mm solid #f59e0b;
}}
.bh-circle-sm {{
    position: absolute; bottom: 80mm; left: 50mm;
    width: 25mm; height: 25mm; background: #1a1a1a; border-radius: 50%;
}}
.bh-line-diag {{
    position: absolute; top: 0; left: 50%;
    width: 2px; height: 100%; background: #1a1a1a;
    transform: rotate(15deg); transform-origin: top center;
}}
.bh-strip {{
    position: absolute; bottom: 0; left: 0; right: 0;
    height: 15mm; background: #1a1a1a;
}}
.bh-strip-yellow {{
    position: absolute; bottom: 15mm; left: 0;
    width: 40%; height: 5mm; background: #f59e0b;
}}

/* Cover content — neutralise h1 inherited styling */
.cover-meta {{
    position: absolute; top: 30mm; left: 25mm;
    font-size: 8pt; color: #999; letter-spacing: 0.15em;
    font-weight: 500; z-index: 1;
}}
.cover-content {{
    position: absolute; bottom: 55mm; left: 25mm; z-index: 1;
    max-width: 60%;
}}
.cover-title {{
    font-size: 38pt; font-weight: 900; color: #1a1a1a;
    line-height: 1.1; letter-spacing: -0.01em; margin-bottom: 0.3cm;
    padding: 0;
    background: none !important;
    display: block !important;
    border: none !important;
    page-break-before: auto !important;
    string-set: none;
}}
.cover-subtitle {{
    font-size: 11pt; color: #666; font-weight: 500; letter-spacing: 0.1em;
}}
.cover-footer {{
    position: absolute; bottom: 25mm; left: 25mm; z-index: 1;
    font-size: 9pt; color: #666; line-height: 1.8; letter-spacing: 0.05em;
}}
.cover-footer p {{ margin: 0.1em 0; }}

/* ===== TOC ===== */
.toc-page {{
    page: toc; page-break-after: always; padding-top: 1cm;
}}
.toc-title {{
    font-size: 24pt; font-weight: 900; color: #1a1a1a;
    margin-bottom: 1cm; padding-bottom: 0.3cm;
    border-bottom: 3px solid #1a1a1a;
    letter-spacing: 0.02em;
}}
.toc-list {{
    list-style: none; padding: 0; margin: 0;
}}
.toc-list li {{
    margin: 0;
}}
.toc-list a {{
    color: #1a1a1a; text-decoration: none; display: block;
    padding: 0.3em 0; border-bottom: 0.5px solid #ddd;
    font-size: 10pt; font-weight: 500;
}}
.toc-list a::after {{
    content: "      " target-counter(attr(href), page);
    /* leader(".") removed: WeasyPrint renders it as garbled chars */
    float: right; color: #e63946; font-weight: 900;
}}
.toc-l1 > a {{
    font-weight: 700; font-size: 11pt; color: #1a1a1a;
    border-bottom-color: #ccc; margin-top: 0.4em;
}}
.toc-l2 {{
    padding-left: 2em; font-size: 9.5pt; font-weight: 400;
}}

/* ===== Headings — Bauhaus primary color blocks ===== */
h1 {{
    font-size: 22pt; font-weight: 900; color: #1a1a1a;
    margin-top: 0; margin-bottom: 0.5cm;
    padding: 0.15cm 0.4cm 0.15cm 0.3cm;
    background: rgba(245, 158, 11, 0.35);
    display: inline-block;
    page-break-before: always;
    string-set: doctitle content();
}}
body.cover-page h1:first-of-type {{
    page-break-before: auto;
}}
h2 {{
    font-size: 14pt; font-weight: 700; color: #1a1a1a;
    margin-top: 0.6cm; margin-bottom: 0.3cm;
    border-left: 4px solid #e63946; padding-left: 0.4cm;
    page-break-after: avoid;
}}
h3 {{
    font-size: 11pt; font-weight: 700; color: #2563eb;
    margin-top: 0.4cm; margin-bottom: 0.2cm;
    page-break-after: avoid;
}}
h4 {{
    font-size: 10pt; font-weight: 700; color: #1a1a1a;
    margin-top: 0.5cm; margin-bottom: 0.2cm;
}}

/* ===== Paragraphs ===== */
p {{
    margin: 0.3em 0; orphans: 2; widows: 2;
}}

/* ===== Blockquotes ===== */
blockquote {{
    border-left: 4px solid #1a1a1a;
    padding: 0.6em 1em; margin: 0.4cm 0;
    font-size: 10pt; color: #333; background: #f5f5f5;
}}
blockquote p {{ margin: 0.2em 0; }}

/* ===== Code ===== */
code {{
    font-family: "SF Mono", "Menlo", "Courier New", monospace;
    font-size: 9pt; background: #f0f0f0; padding: 0.15em 0.4em;
    color: #e63946;
}}
pre {{
    background: #f5f5f5; border: 1px solid #e0e0e0;
    padding: 0.8em 1em; margin: 0.5cm 0;
    font-size: 9pt; line-height: 1.5; overflow-x: auto;
    page-break-inside: avoid;
}}
pre code {{
    background: none; padding: 0; color: #333;
}}

/* ===== Tables ===== */
table {{
    width: 100%; max-width: 100%; border-collapse: collapse;
    margin: 0.4cm 0; font-size: 9pt; box-sizing: border-box;
}}
thead {{ display: table-header-group; }}
thead tr {{
    background: #2a2a2a; color: #ffffff;
}}
th {{
    padding: 0.4em 0.6em; text-align: left;
    font-weight: 700; font-size: 8pt; letter-spacing: 0.03em;
}}
td {{
    padding: 0.4em 0.6em; text-align: left; vertical-align: top;
    border-bottom: 0.5px solid #ddd;
}}
tbody tr:nth-child(even) {{ background: #f5f5f5; }}
tbody tr:last-child {{ border-bottom: 2px solid #1a1a1a; }}
tr {{ page-break-inside: avoid; }}

/* ===== Lists ===== */
ul {{
    margin: 0.3em 0; padding-left: 2em;
    list-style-type: none;
}}
ul li::before {{
    content: "\2013";  /* en-dash替代 small square (U+25AA在部分PDF渲染异常) */
    display: inline-block; width: 1.5em; margin-left: -1.5em;
    color: #e63946;
}}
ol {{
    margin: 0.3em 0; padding-left: 2em;
    list-style-type: decimal;
}}
ol li::marker {{
    color: #e63946; font-weight: 700;
}}
li {{ margin-bottom: 0.15em; }}

/* ===== Emphasis ===== */
strong {{ font-weight: 700; color: #1a1a1a; }}
em {{ font-style: italic; color: #555; }}

/* ===== Horizontal rule ===== */
hr {{
    border: none; height: 3px;
    background: #1a1a1a;
    margin: 0.6cm 0;
}}

/* ===== Links ===== */
a {{ word-break: break-all; color: #2563eb; text-decoration: none; }}

/* ===== Images ===== */
img {{ max-width: 100%; height: auto; }}

/* ===== Page break helpers ===== */
figure, blockquote, table, pre {{
    page-break-inside: avoid;
}}
h1, h2, h3, h4 {{
    page-break-inside: avoid;
}}

/* ===== Overflow protection ===== */
pre, table, figure, img, svg, blockquote {{
    max-width: 100%; box-sizing: border-box;
}}

/* ===== Container blocks — Bauhaus DNA ===== */
.intro-block {{
    background: #f59e0b; padding: 0.5em 0.8em; margin: 0.4cm 0;
    font-size: 9.5pt; font-weight: 500; color: #1a1a1a;
}}
.quote-box {{
    border: 3px solid #1a1a1a; padding: 0.6em 1em; margin: 0.4cm 0;
    font-size: 10pt; background: #fff; color: #333;
    box-shadow: 5px 5px 0 #2563eb;
}}
.memo-section {{
    border: 2px solid #1a1a1a; padding: 0.5em 0.7em; margin: 0.4cm 0;
    font-size: 9pt; background: #fff; color: #333;
}}
.memo-title {{
    font-weight: 900; color: #e63946; margin-bottom: 0.15em;
    font-size: 8pt; text-transform: uppercase; letter-spacing: 0.1em;
}}
.section-note {{
    font-size: 8.5pt; color: #666; padding: 0.3em 0.6em;
    background: #f5f5f5; border-left: 4px solid #f59e0b; margin: 0.2cm 0;
}}
.theorem {{
    border-left: 3px solid #2563eb;
    background: rgba(245, 158, 11, 0.08);
    padding: 0.6em 1em; margin: 0.4cm 0;
    font-size: 9.5pt; color: #1a1a1a;
}}

/* ===== Container page breaks ===== */
.intro-block, .quote-box, .memo-section, .theorem, .section-note {{
    page-break-inside: avoid;
}}
</style>
</head>
<body class="cover-page">

<!-- ===== Cover ===== -->
<div class="cover">
    <div class="bh-circle-red"></div>
    <div class="bh-rect-blue"></div>
    <div class="bh-tri-yellow"></div>
    <div class="bh-circle-sm"></div>
    <div class="bh-line-diag"></div>
    <div class="bh-strip"></div>
    <div class="bh-strip-yellow"></div>
    <div class="cover-meta">{cover_label}</div>
    <div class="cover-content">
        <h1 class="cover-title">{title}</h1>
        <div class="cover-subtitle">{subtitle}</div>
    </div>
    <div class="cover-footer">
        <p>{author_line}</p>
        <p>{date_line}</p>
    </div>
</div>

<!-- ===== TOC ===== -->
<div class="toc-page">
    <div class="toc-title">INHALT / 目&ensp;录</div>
    <ul class="toc-list">
{toc_items}
    </ul>
</div>

<!-- ===== Body ===== -->
{body}

</body>
</html>
