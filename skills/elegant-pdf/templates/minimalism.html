<!-- elegant-pdf template — minimalism style -->
<!DOCTYPE html>
<html lang="{lang}">
<head>
<meta charset="UTF-8">
<title>{title}</title>
<style>
/* ===== Reset ===== */
/* DESKOP-MODIFIED: Noto Sans CJK SC 系统字体 fallback 链（WeasyPrint 不卡 Google Fonts） */
body {{
    margin: 0; padding: 0;
    font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 10.5pt; line-height: 1.8;
    color: #333; text-align: justify; text-align-last: left;
    string-set: doctitle "{running_title}";
    background: #fff;
}}

/* ===== Page — 大留白 margin 4cm 3.5cm，仅底部灰色页码 ===== */
@page {{
    size: A4; margin: 2.5cm 2.5cm 3cm 2.5cm;
    @bottom-center {{
        content: counter(page);
        font-size: 8pt; color: #ccc;
    }}
}}

@page cover {{
    margin: 0;
    @bottom-center {{ content: none; }}
}}

@page toc {{
    @bottom-center {{ content: none; }}
}}

/* ===== Cover — 极简骨架：上下细竖线 #ddd + 居中排版 ===== */
/* 降级：原型用 display:flex 居中 → 改 absolute + translate（warm-academic 已验证此路） */
.cover {{
    page: cover; width: 210mm; height: 297mm; margin: 0;
    position: relative; overflow: hidden; page-break-after: always;
    background: #fff;
}}

.cover-content {{
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    text-align: center; z-index: 1;
}}

/* 上下细竖线（极简 DNA 签名元素） */
.cover-line-top {{
    width: 1px; height: 60px; background: #ddd;
    margin: 0 auto 2cm auto;
}}

.cover-line-bottom {{
    width: 1px; height: 60px; background: #ddd;
    margin: 2cm auto 0 auto;
}}

.cover-label {{
    font-size: 8pt; letter-spacing: 0.35em; color: #999;
    text-transform: uppercase; margin-bottom: 1.8cm; font-weight: 300;
}}

.cover-title {{
    font-size: 16pt; font-weight: 400; color: #333;
    letter-spacing: 0.3em; line-height: 2;
    margin: 0 0 0.5cm 0; border: none !important;
    page-break-before: auto !important;
}}

/* 30px 黑色 1px 分隔线（极简 DNA 签名元素） */
.cover-divider {{
    width: 30px; height: 1px; background: #333;
    margin: 1cm auto;
}}

.cover-subtitle {{
    font-size: 9pt; color: #999; letter-spacing: 0.15em;
    font-weight: 300; margin: 0 0 1.5cm 0;
}}

.cover-meta {{
    font-size: 8.5pt; color: #999; line-height: 2.2; letter-spacing: 0.05em;
    font-weight: 400; margin-bottom: 0;
}}

.cover-meta p {{ margin: 0.2em 0; }}

body.cover-page h1:first-of-type {{
    page-break-before: auto;
}}

/* ===== TOC — 极简 DNA：故意不加 leader，仅灰 0.5px 分隔线 + 右浮页码 ===== */
.toc-page {{
    page: toc; page-break-after: always;
}}

.toc-title {{
    font-size: 14pt; font-weight: 400; color: #333;
    text-align: center; margin: 0.5cm 0 1.5cm 0;
    letter-spacing: 0.2em;
}}

.toc-list {{
    list-style: none; padding: 0; margin: 0;
}}

.toc-list li {{
    margin: 0;
}}

.toc-list a {{
    color: #333; text-decoration: none; display: block;
    padding: 0.6em 0; border-bottom: 0.5px solid #eee;
    font-size: 10pt; font-weight: 400; letter-spacing: 0.05em;
}}

/* 无 leader 点导引线，仅右浮灰色页码——保持极简留白 */
.toc-list a::after {{
    content: target-counter(attr(href), page);
    float: right; color: #ccc; font-size: 9pt;
}}

.toc-l1 > a {{
    font-weight: 500; font-size: 10.5pt; color: #333;
}}

.toc-l2 {{
    padding-left: 1.5em; font-size: 9.5pt; color: #888;
}}

/* ===== Headings — 极轻 weight 500，无装饰 ===== */
h1 {{
    font-size: 16pt; font-weight: 500; color: #333;
    margin: 0 0 0.5cm 0; padding-bottom: 0.15cm;
    border-bottom: 0.5px solid #ddd;
    page-break-before: always; letter-spacing: 0.1em;
    string-set: doctitle content();
}}

h2 {{
    font-size: 12pt; font-weight: 500; color: #555;
    margin: 1cm 0 0.4cm 0; page-break-after: avoid;
}}

h3 {{
    font-size: 10.5pt; font-weight: 500; color: #666;
    margin: 0.6cm 0 0.3cm 0; page-break-after: avoid;
}}

h4 {{
    font-size: 10pt; font-weight: 500; color: #666;
    margin: 0.4cm 0 0.2cm 0;
}}

/* ===== Paragraphs ===== */
p {{
    margin: 0.5em 0; orphans: 2; widows: 2;
}}

/* ===== Container blocks ===== */
.intro-block {{
    padding: 0.8em 0; margin: 0.8cm 0;
    font-size: 10pt; color: #666;
    border-top: 0.5px solid #eee; border-bottom: 0.5px solid #eee;
}}

.quote-box {{
    padding: 1em 0; margin: 0.8cm 0;
    font-size: 11pt; color: #555; font-style: italic; line-height: 1.9;
}}

.memo-section {{
    padding: 0.8em 0; margin: 0.6cm 0;
    font-size: 9pt; color: #888;
    border-top: 0.5px solid #eee;
}}

.memo-title {{
    font-weight: 500; color: #333; margin-bottom: 0.3em;
    font-size: 8pt; letter-spacing: 0.15em; text-transform: uppercase;
}}

.section-note {{
    font-size: 9pt; color: #aaa; padding: 0.5em 0;
    margin: 0.5cm 0; border-top: 0.5px solid #f5f5f5;
}}

/* .theorem — 极简：0.5px 灰左边线 + padding-left 1em，不加背景 */
.theorem {{
    border-left: 0.5px solid #ccc;
    padding: 0.3em 0 0.3em 1em;
    margin: 0.6cm 0;
    font-size: 10pt; color: #555;
}}

/* ===== Code ===== */
code {{
    font-family: "SF Mono", "Menlo", "Courier New", monospace;
    font-size: 9pt; background: #f7f7f7; padding: 0.15em 0.4em;
    color: #555;
}}

pre {{
    background: #fafafa; border: 1px solid #eee;
    padding: 0.8em 1em; margin: 0.6cm 0;
    font-size: 9pt; line-height: 1.5; overflow-x: auto;
    page-break-inside: avoid;
}}

pre code {{
    background: none; padding: 0;
}}

/* ===== Tables — 极简三线式（顶/表头/底三根线 + 极淡行间线） ===== */
table {{
    width: 100%; max-width: 100%; border-collapse: collapse;
    margin: 0.8cm 0; font-size: 9.5pt; box-sizing: border-box;
}}

thead {{ display: table-header-group; }}

thead tr {{
    border-top: 0.5px solid #333;
    border-bottom: 0.5px solid #333;
}}

th {{
    padding: 0.5em 0.8em; text-align: left;
    font-weight: 500; color: #333; font-size: 8.5pt; letter-spacing: 0.05em;
}}

td {{
    padding: 0.5em 0.8em; text-align: left; vertical-align: top;
    border-bottom: 0.5px solid #f0f0f0;
}}

tbody tr:last-child {{
    border-bottom: 0.5px solid #333;
}}

tr {{ page-break-inside: avoid; }}

/* ===== Lists ===== */
ul {{
    margin: 0.5em 0; padding-left: 1.5em;
    list-style-type: none;
}}

ol {{
    margin: 0.5em 0; padding-left: 1.5em;
    list-style-type: decimal;
}}

li {{
    margin-bottom: 0.3em;
}}

li::marker {{
    color: #ccc;
}}

/* ===== Emphasis ===== */
strong {{ font-weight: 500; color: #333; }}
em {{ font-style: italic; color: #555; }}

/* ===== Blockquote ===== */
blockquote {{
    padding: 0.5em 0; margin: 0.8cm 0;
    font-size: 10pt; color: #666; font-style: italic; line-height: 1.9;
}}

blockquote p {{ margin: 0.2em 0; }}

/* ===== Horizontal rule ===== */
hr {{
    border: none; height: 1px;
    background: #ddd;
    margin: 1cm 0;
}}

/* ===== Links ===== */
a {{
    word-break: break-all; color: #999; text-decoration: none;
}}

/* ===== Images ===== */
img {{
    max-width: 100%; height: auto;
}}

/* ===== Page break helpers ===== */
figure, blockquote, table, pre {{
    page-break-inside: avoid;
}}

h1, h2, h3, h4 {{
    page-break-inside: avoid;
}}

/* ===== Overflow protection ===== */
pre, table, figure, img, svg, blockquote {{
    max-width: 100%; box-sizing: border-box;
}}

figure, .memo-section, .quote-box, .intro-block, .theorem {{
    page-break-inside: avoid;
}}
</style>
</head>
<body class="cover-page">

<!-- ===== Cover ===== -->
<div class="cover">
    <div class="cover-content">
        <div class="cover-line-top"></div>
        <div class="cover-label">{cover_label}</div>
        <h1 class="cover-title">{title}</h1>
        <div class="cover-divider"></div>
        <p class="cover-subtitle">{subtitle}</p>
        <div class="cover-meta">
            <p>{author_line}</p>
            <p>{date_line}</p>
        </div>
        <div class="cover-line-bottom"></div>
    </div>
</div>

<!-- ===== TOC ===== -->
<div class="toc-page">
    <div class="toc-title">目&ensp;录</div>
    <ul class="toc-list">
{toc_items}
    </ul>
</div>

<!-- ===== Body ===== -->
{body}

</body>
</html>
