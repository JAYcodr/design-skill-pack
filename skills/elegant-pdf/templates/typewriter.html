<!-- elegant-pdf template — typewriter style -->
<!DOCTYPE html>
<html lang="{lang}">
<head>
<meta charset="UTF-8">
<title>{title}</title>
<style>
/* ===== Reset ===== */
body {{
    margin: 0; padding: 0;
    font-family: "Noto Sans Mono CJK SC", "Sarasa Mono SC", "Courier New", "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", monospace;
    letter-spacing: 0.03em;
    font-size: 10pt; line-height: 1.6;
    color: #3d3428; text-align: justify; text-align-last: left;
    string-set: doctitle "{running_title}";
    background: #e8e0d0;
}}

/* ===== Page ===== */
@page {{
    size: A4; margin: 2.5cm 2.5cm 2cm 2.5cm;
    background: #e8e0d0;
    @top-left {{
        content: string(doctitle);
        font-size: 7pt; color: #999; letter-spacing: 0.05em;
        font-family: "Courier New", monospace;
    }}
    @bottom-center {{
        content: "PAGE " counter(page) " OF " counter(pages);
        font-size: 8pt; color: #999;
        font-family: "Courier New", monospace;
    }}
}}

@page cover {{
    margin: 0;
    @top-left {{ content: none; }}
    @bottom-center {{ content: none; }}
}}

@page toc {{
    @top-left {{ content: none; }}
}}

/* ===== Cover — kraft paper + typewriter motifs ===== */
.cover {{
    page: cover; width: 210mm; height: 297mm; margin: 0;
    position: relative; overflow: hidden; page-break-after: always;
    background: #d8d0c0;
}}

/* 内嵌纸张效果（box-shadow 制造立体感） */
.cover-paper {{
    position: absolute; top: 30mm; left: 25mm; right: 25mm; bottom: 30mm;
    background: #f0ebe0; z-index: 0;
    box-shadow: 3px 3px 10px rgba(0,0,0,0.12);
}}

/* 打字机压痕虚线 ruler */
.cover-ruler {{
    position: absolute; top: 45mm; left: 30mm; right: 30mm; height: 0;
    border-top: 0.5px dashed #c8c0b0; z-index: 1;
}}
.cover-ruler-2 {{
    position: absolute; top: 55mm; left: 30mm; right: 30mm; height: 0;
    border-top: 0.5px dashed #c8c0b0; z-index: 1;
}}
.cover-ruler-3 {{
    position: absolute; bottom: 50mm; left: 30mm; right: 30mm; height: 0;
    border-top: 0.5px dashed #c8c0b0; z-index: 1;
}}

/* 咖啡渍（双层 border-radius 圆环） */
.coffee-stain {{
    position: absolute; bottom: 50mm; right: 45mm;
    width: 40px; height: 40px;
    border: 3px solid rgba(139,90,43,0.15); border-radius: 50%; z-index: 1;
}}
.coffee-stain::after {{
    content: ""; position: absolute;
    top: 3px; left: 3px; right: 3px; bottom: 3px;
    border: 1px solid rgba(139,90,43,0.08); border-radius: 50%;
}}

/* 回形针（CSS 模拟） */
.paper-clip {{
    position: absolute; top: 35mm; left: 50%;
    transform: translateX(-50%);
    width: 12px; height: 40px;
    border: 2px solid #999; border-radius: 0 0 6px 6px; border-top: none;
    z-index: 1; opacity: 0.4;
}}

.cover-content {{
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); text-align: center; width: 60%; z-index: 1;
}}

.cover-meta {{
    font-size: 8pt; color: #999; letter-spacing: 0.1em;
    margin-bottom: 1.5cm;
    font-family: "Courier New", monospace;
}}

.cover-title {{
    font-size: 22pt; font-weight: 700; color: #3d3428;
    margin-bottom: 0.5cm; line-height: 1.6; letter-spacing: 0.05em;
    border: none !important; page-break-before: auto !important;
}}

.cover-divider {{
    width: 100%; height: 0.5px; background: #c8c0b0;
    margin: 1cm auto;
}}

.cover-subtitle {{
    font-size: 10pt; color: #666;
    font-family: "Courier New", monospace; letter-spacing: 0.05em;
    margin-bottom: 1.5cm;
}}

.cover-author-date {{
    font-size: 8pt; color: #999; letter-spacing: 0.1em;
    font-family: "Courier New", monospace; line-height: 2;
}}

.cover-author-date p {{
    margin: 0.2em 0;
}}

.cover-footer {{
    position: absolute; bottom: 40mm; left: 30mm; right: 30mm;
    text-align: center; font-size: 7pt; color: #bbb;
    font-family: "Courier New", monospace; letter-spacing: 0.05em;
    z-index: 1;
}}

/* ===== TOC ===== */
.toc-page {{
    page: toc; page-break-after: always; padding-top: 1cm;
}}

.toc-title {{
    font-size: 12pt; font-weight: 700; color: #3d3428;
    margin-bottom: 0.8cm; padding-bottom: 0.2cm;
    border-bottom: 0.5px solid #c8c0b0;
    font-family: "Courier New", monospace; letter-spacing: 0.1em;
}}

.toc-list {{
    list-style: none; padding: 0; margin: 0;
}}

.toc-list li {{
    margin: 0;
}}

.toc-list a {{
    color: #3d3428; text-decoration: none; display: block;
    padding: 0.25em 0; border-bottom: 0.5px dashed #d8d0c0;
    font-size: 9.5pt;
    font-family: "Courier New", "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", monospace;
}}

.toc-list a::after {{
    content: ">>> P." target-counter(attr(href), page);
    float: right; color: #999;
}}

.toc-l1 > a {{
    font-weight: 700; margin-top: 0.3em;
}}

.toc-l2 {{
    padding-left: 2em; font-weight: 400; font-size: 9pt;
}}

/* ===== Headings — Songti serif for distinct CJK display ===== */
h1 {{
    font-size: 16pt; font-weight: 700; color: #3d3428;
    margin-top: 0; margin-bottom: 0.5cm; padding-bottom: 0.2cm;
    border-bottom: 2px solid #3d3428;
    page-break-before: always; letter-spacing: 0.05em;
    string-set: doctitle content();
    font-family: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", serif;
}}

h1:first-of-type {{
    page-break-before: auto;
}}

h2 {{
    font-size: 12pt; font-weight: 700; color: #3d3428;
    margin-top: 0.6cm; margin-bottom: 0.3cm;
    page-break-after: avoid;
    font-family: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", serif;
}}

h3 {{
    font-size: 10.5pt; font-weight: 600; color: #555;
    margin-top: 0.4cm; margin-bottom: 0.2cm;
    page-break-after: avoid;
}}

h4 {{
    font-size: 10pt; font-weight: 600; color: #555;
    margin-top: 0.3cm; margin-bottom: 0.15cm;
}}

/* ===== Paragraphs ===== */
p {{
    margin: 0.35em 0; orphans: 2; widows: 2;
}}

/* ===== Container blocks (typewriter DNA) ===== */
.intro-block {{
    padding: 0.5em 0.8em; margin: 0.4cm 0;
    font-size: 9.5pt; background: #e0d8c8;
    border-left: 3px solid #8b7d6b;
    font-family: "Courier New", "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", monospace;
}}

.quote-box {{
    padding: 0.6em 1em; margin: 0.4cm 0;
    font-size: 10pt; font-style: italic;
    background: #e8e0d0; border: 0.5px solid #d0c8b8;
}}
.quote-box::before {{
    content: ">>>";
    color: #999; font-family: "Courier New", monospace;
    margin-right: 0.5em; font-style: normal;
}}

.memo-section {{
    padding: 0.5em 0.7em; margin: 0.4cm 0;
    font-size: 9pt; background: #e0d8c8;
    border: 0.5px solid #d0c8b8;
    font-family: "Courier New", "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", monospace;
}}

.memo-title {{
    font-weight: 700; color: #8b5a2b;
    margin-bottom: 0.15em; font-size: 8pt; letter-spacing: 0.1em;
    font-family: "Courier New", monospace;
}}

.section-note {{
    font-size: 8.5pt; color: #888; padding: 0.3em 0.6em;
    margin: 0.3cm 0; background: #e8e0d0;
    border-left: 2px solid #c8c0b0;
    font-family: "Courier New", monospace;
}}

/* .theorem — 打字机风格: double 左边线 + >>> THEOREM 前缀 */
.theorem {{
    border-left: 3px double #3d3428;
    padding: 0.6em 1em; margin: 0.4cm 0;
    background: #e0d8c8;
    font-family: "Courier New", "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", monospace;
    font-size: 9.5pt;
}}
.theorem::before {{
    content: ">>> THEOREM";
    display: block; font-weight: 700; color: #3d3428;
    margin-bottom: 0.3em; font-size: 8pt; letter-spacing: 0.1em;
    font-family: "Courier New", monospace;
}}

blockquote {{
    padding: 0.5em 0.9em; margin: 0.4cm 0;
    font-size: 10pt; font-style: italic; color: #5a4a3a;
    background: #e8e0d0; border-left: 2px solid #8b7d6b;
}}
blockquote p {{
    margin: 0.2em 0;
}}

/* ===== Code ===== */
code {{
    font-family: "Courier New", monospace;
    font-size: 9pt; background: #e0d8c8; padding: 0.15em 0.4em;
    color: #5a4a3a;
}}

pre {{
    background: #f0ebe0; border: 0.5px solid #d0c8b8;
    border-radius: 2px; padding: 0.6em 0.8em; margin: 0.4cm 0;
    font-size: 8.5pt; line-height: 1.5; overflow-x: auto;
    page-break-inside: avoid;
    box-shadow: 1px 1px 4px rgba(0,0,0,0.06);
}}
pre code {{
    background: none; padding: 0; border-radius: 0;
}}

/* ===== Tables ===== */
table {{
    width: 100%; max-width: 100%; border-collapse: collapse;
    margin: 0.4cm 0; font-size: 9pt; box-sizing: border-box;
    font-family: "Courier New", "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", monospace;
}}
thead {{
    display: table-header-group;
}}
thead tr {{
    border-top: 1.5px solid #3d3428; border-bottom: 1px solid #3d3428;
}}
th {{
    padding: 0.4em 0.6em; text-align: left;
    font-weight: 700; color: #3d3428; font-size: 8pt;
}}
td {{
    padding: 0.4em 0.6em; text-align: left; vertical-align: top;
    border-bottom: 0.5px solid #d0c8b8;
}}
tbody tr:last-child {{
    border-bottom: 1.5px solid #3d3428;
}}
tr {{
    page-break-inside: avoid;
}}

/* ===== Lists ===== */
ul {{
    margin: 0.3em 0; padding-left: 1.5em;
    list-style-type: none;
}}
ol {{
    margin: 0.3em 0; padding-left: 2em;
    list-style-type: decimal;
}}
li {{
    margin-bottom: 0.15em;
}}
li::marker {{
    color: #8b7d6b;
}}

/* ===== Emphasis ===== */
strong {{
    font-weight: 700; color: #3d3428;
}}
em {{
    font-style: italic; color: #555;
}}

/* ===== Horizontal rule — dashed typewriter style ===== */
hr {{
    border: none; height: 0;
    border-top: 0.5px dashed #c8c0b0;
    margin: 0.6cm 0;
}}

/* ===== Links ===== */
a {{
    word-break: break-all; color: #8b5a2b; text-decoration: none;
}}

/* ===== Images ===== */
img {{
    max-width: 100%; height: auto;
}}

/* ===== Page break helpers ===== */
figure, .memo-section, .quote-box, .intro-block, .theorem, blockquote {{
    page-break-inside: avoid;
}}
h1, h2, h3, h4 {{
    page-break-inside: avoid;
}}
pre, table {{
    page-break-inside: avoid;
}}

/* ===== Overflow protection ===== */
pre, table, figure, img, svg, blockquote {{
    max-width: 100%; box-sizing: border-box;
}}
</style>
</head>
<body>

<!-- ===== Cover ===== -->
<div class="cover">
    <div class="cover-paper"></div>
    <div class="paper-clip"></div>
    <div class="cover-ruler"></div>
    <div class="cover-ruler-2"></div>
    <div class="cover-ruler-3"></div>
    <div class="coffee-stain"></div>
    <div class="cover-content">
        <div class="cover-meta">{cover_label}</div>
        <div class="cover-title">{title}</div>
        <div class="cover-divider"></div>
        <div class="cover-subtitle">{subtitle}</div>
        <div class="cover-author-date">
            <p>{author_line}</p>
            <p>{date_line}</p>
        </div>
    </div>
    <div class="cover-footer">TYPED ON VINTAGE TYPEWRITER &middot; CLASSIFIED</div>
</div>

<!-- ===== TOC ===== -->
<div class="toc-page">
    <div class="toc-title">--- INDEX ---</div>
    <ul class="toc-list">
{toc_items}
    </ul>
</div>

<!-- ===== Body ===== -->
{body}

</body>
</html>
