<!-- elegant-pdf template — art nouveau style -->
<!DOCTYPE html>
<html lang="{lang}">
<head>
<meta charset="UTF-8">
<title>{title}</title>
<style>
/* ===== Reset ===== */
body {{
    margin: 0; padding: 0;
    font-family: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", "STSong", serif;
    font-size: 10.5pt; line-height: 1.75;
    color: #2a2420; text-align: justify; text-align-last: left;
    string-set: doctitle "{running_title}";
}}

/* ===== Page ===== */
@page {{
    size: A4; margin: 2.4cm 2.2cm 2.5cm 2.2cm;
    @top-center {{
        content: string(doctitle);
        font-size: 8pt; color: #b8945a; font-style: italic;
        letter-spacing: 0.1em; font-family: "Noto Serif CJK SC", "Source Han Serif SC", "Songti SC", serif;
    }}
    @bottom-center {{
        content: counter(page);
        font-size: 9pt; color: #b8945a;
    }}
}}

@page cover {{
    margin: 0;
    @top-center {{ content: none; }}
    @bottom-center {{ content: none; }}
}}

@page toc {{
    @top-center {{ content: none; }}
}}

/* ===== Cover ===== */
.cover {{
    page: cover; width: 210mm; height: 297mm; margin: 0;
    position: relative; overflow: hidden; page-break-after: always;
    background: linear-gradient(160deg, #f7f2ea 0%, #efe6d5 50%, #e8dcc8 100%);
}}

.cover::before {{
    content: ""; position: absolute; top: -100px; right: -80px;
    width: 400px; height: 400px; border-radius: 50%;
    background: radial-gradient(circle, rgba(184, 148, 90, 0.12) 0%, transparent 65%);
}}

.cover::after {{
    content: ""; position: absolute; bottom: -60px; left: -60px;
    width: 350px; height: 350px; border-radius: 50%;
    background: radial-gradient(circle, rgba(139, 115, 85, 0.1) 0%, transparent 65%);
}}

/* 四角圆角花纹（新艺术签名：每角一个 div，双向 2px + 单角 border-radius） */
.corner-flourish {{
    position: absolute; width: 100px; height: 100px;
}}
.corner-flourish-tl {{
    top: 30px; left: 30px;
    border-top: 2px solid #b8945a; border-left: 2px solid #b8945a;
    border-radius: 20px 0 0 0;
}}
.corner-flourish-tr {{
    top: 30px; right: 30px;
    border-top: 2px solid #b8945a; border-right: 2px solid #b8945a;
    border-radius: 0 20px 0 0;
}}
.corner-flourish-bl {{
    bottom: 30px; left: 30px;
    border-bottom: 2px solid #b8945a; border-left: 2px solid #b8945a;
    border-radius: 0 0 0 20px;
}}
.corner-flourish-br {{
    bottom: 30px; right: 30px;
    border-bottom: 2px solid #b8945a; border-right: 2px solid #b8945a;
    border-radius: 0 0 20px 0;
}}

/* 中央双圆环 — 新艺术签名元素 */
.cover-circle {{
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 200px; height: 200px;
    border: 1px solid rgba(184, 148, 90, 0.25); border-radius: 50%;
}}
.cover-circle-2 {{
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%);
    width: 240px; height: 240px;
    border: 0.5px solid rgba(184, 148, 90, 0.15); border-radius: 50%;
}}

.cover-content {{
    position: absolute; top: 50%; left: 50%;
    transform: translate(-50%, -50%); text-align: center; width: 70%; z-index: 1;
}}

.cover-ornament {{
    font-size: 24pt; color: #b8945a; letter-spacing: 0.3em;
    margin-bottom: 1cm; line-height: 1;
}}

.cover-label {{
    font-size: 10pt; letter-spacing: 0.35em; color: #b8945a;
    text-transform: uppercase; margin-bottom: 1.5cm; font-weight: 400;
}}

.cover-title {{
    font-size: 32pt; font-weight: 700; color: #3d3020;
    margin-bottom: 0.5cm; letter-spacing: 0.08em; line-height: 1.4;
    border: none !important; page-break-before: auto !important;
}}

.cover-divider {{
    width: 80px; height: 1.5px;
    background: linear-gradient(90deg, transparent, #b8945a, transparent);
    margin: 0 auto 0.8cm auto;
}}

.cover-subtitle {{
    font-size: 12pt; color: #7a6850; letter-spacing: 0.2em;
    font-style: italic; margin-bottom: 2cm;
}}
.cover-subtitle p {{ margin: 0; }}

.cover-meta {{
    font-size: 9.5pt; color: #9a8a70; line-height: 2.2;
    letter-spacing: 0.05em; font-style: italic;
}}
.cover-meta p {{ margin: 0.2em 0; }}

/* ===== TOC ===== */
.toc-page {{
    page: toc; page-break-after: always; padding-top: 2cm;
}}

.toc-header {{
    text-align: center; margin-bottom: 1.5cm;
}}
.toc-title {{
    font-size: 20pt; font-weight: 700; color: #3d3020;
    letter-spacing: 0.3em;
}}
.toc-header-sub {{
    font-size: 10pt; color: #b8945a; letter-spacing: 0.15em;
    margin-top: 0.3cm;
}}

.toc-list {{
    list-style: none; padding: 0; margin: 0 auto; max-width: 80%;
}}

.toc-list li {{
    margin: 0;
}}

.toc-list a {{
    color: #2a2420; text-decoration: none; display: block;
    padding: 0.4em 0; border-bottom: 0.5px solid #ddd3c4; font-size: 10.5pt;
}}

/* 点导引线 leader — art-nouveau 标准实现 */
.toc-list a::after {{
    content: "      " target-counter(attr(href), page);
    /* leader(".") removed: WeasyPrint renders it as garbled chars */
    float: right; color: #b8945a;
}}

.toc-l1 > a {{
    font-weight: 600; font-size: 11pt; color: #3d3020;
    margin-top: 0.5em;
}}
.toc-l1 > a .toc-num {{
    color: #b8945a; margin-right: 0.5em; font-size: 10pt;
}}

.toc-l2 {{
    padding-left: 2em; font-size: 10pt;
}}

/* ===== Headings ===== */
h1 {{
    font-size: 22pt; font-weight: 700; color: #3d3020;
    margin-top: 0; margin-bottom: 0.6cm;
    padding: 0.3cm 0 0.2cm; border-bottom: 2px solid #b8945a;
    page-break-before: always; letter-spacing: 0.05em;
    string-set: doctitle content();
}}

body.cover-page h1:first-of-type {{
    page-break-before: auto;
}}

h2 {{
    font-size: 14pt; font-weight: 600; color: #5a4a38;
    margin-top: 0.7cm; margin-bottom: 0.3cm; padding-left: 0.5em;
    border-left: 3px solid #b8945a; page-break-after: avoid;
}}

/* 新艺术签名：H3 带 ~ 前缀 */
h3 {{
    font-size: 11.5pt; font-weight: 600; color: #6a5d50;
    margin-top: 0.5cm; margin-bottom: 0.2cm; page-break-after: avoid;
    position: relative; padding-left: 1.2em;
}}
h3::before {{
    content: "~"; position: absolute; left: 0;
    color: #b8945a; font-size: 14pt;
}}

h4 {{
    font-size: 10.5pt; font-weight: 600; color: #6a5d50;
    margin-top: 0.4cm; margin-bottom: 0.2cm;
}}

/* ===== Paragraphs ===== */
p {{
    margin: 0.35em 0; orphans: 2; widows: 2;
}}

/* ===== Intro / Quote blocks ===== */
.intro-block {{
    background: linear-gradient(135deg, #f5efe6 0%, #efe6d5 100%);
    border-left: 3px solid #b8945a;
    padding: 0.7em 1em; margin: 0.5cm 0; font-size: 10pt;
    color: #5a4a38; border-radius: 0 4px 4px 0;
    page-break-inside: avoid;
}}
.intro-block p {{ margin: 0.2em 0; }}

.quote-box {{
    background: #f9f5ee; border: 0.5px solid #ddd3c4;
    padding: 0.8em 1.2em; margin: 0.5cm 0; font-size: 10.5pt;
    color: #5a4a38; font-style: italic; border-radius: 4px;
    position: relative; page-break-inside: avoid;
}}
.quote-box::before {{
    content: open-quote; font-size: 24pt; color: #b8945a;
    position: absolute; top: -5px; left: 8px; line-height: 1;
}}
.quote-box p {{ margin: 0.2em 0; }}

/* ===== Memo ===== */
.memo-section {{
    background: #f9f5ee; border: 0.5px solid #ddd3c4;
    padding: 0.6em 0.8em; margin: 0.4cm 0; font-size: 9.5pt;
    border-radius: 4px; page-break-inside: avoid;
}}
.memo-title {{
    font-weight: 700; color: #b8945a; margin-bottom: 0.2em;
    font-size: 9pt; text-transform: uppercase; letter-spacing: 0.1em;
}}
.memo-section p {{ margin: 0.2em 0; }}

/* ===== Section note ===== */
.section-note {{
    font-size: 9pt; color: #8a7d6b; padding: 0.4em 0.8em;
    background: #f9f5ee; border-left: 2px solid #d4c8b8;
    margin: 0.3cm 0; border-radius: 0 3px 3px 0;
    page-break-inside: avoid;
}}
.section-note p {{ margin: 0.2em 0; }}

/* ===== Theorem — art-nouveau DNA：金褐 3px 左边线 + 暖色 5% 背景 ===== */
.theorem {{
    background: rgba(184, 148, 90, 0.05);
    border-left: 3px solid #b8945a;
    padding: 0.7em 1em; margin: 0.5cm 0; font-size: 10pt;
    color: #4a4036; border-radius: 0 4px 4px 0;
    page-break-inside: avoid;
}}
.theorem::before {{
    content: "❖ 定理"; display: block; font-weight: 700;
    color: #b8945a; margin-bottom: 0.3em; letter-spacing: 0.05em;
}}
.theorem p {{ margin: 0.2em 0; }}

/* ===== Blockquote (alias fallback for ::: 的兜底) ===== */
blockquote {{
    background: linear-gradient(135deg, #f5efe6 0%, #efe6d5 100%);
    border-left: 3px solid #b8945a;
    padding: 0.7em 1em; margin: 0.5cm 0; font-size: 10pt;
    color: #5a4a38; border-radius: 0 4px 4px 0;
}}
blockquote p {{ margin: 0.2em 0; }}

/* ===== Code ===== */
code {{
    font-family: "SF Mono", "Menlo", "Courier New", monospace;
    font-size: 9pt; background: #f3f0eb; padding: 0.15em 0.4em;
    border-radius: 3px; color: #5a4a3a;
}}

pre {{
    background: #f8f6f2; border: 1px solid #e5e0d8;
    border-radius: 4px; padding: 0.8em 1em; margin: 0.5cm 0;
    font-size: 9pt; line-height: 1.5; overflow-x: auto;
    page-break-inside: avoid;
}}

pre code {{
    background: none; padding: 0; border-radius: 0;
}}

/* ===== Tables ===== */
table {{
    width: 100%; max-width: 100%; border-collapse: collapse;
    margin: 0.5cm 0; font-size: 9.5pt; box-sizing: border-box;
}}

thead {{ display: table-header-group; }}

thead tr {{
    border-top: 2px solid #b8945a; border-bottom: 1px solid #b8945a;
}}

th {{
    padding: 0.5em 0.8em; text-align: left;
    font-weight: 700; color: #5a4a38; font-size: 9pt; letter-spacing: 0.03em;
}}

td {{
    padding: 0.5em 0.8em; text-align: left; vertical-align: top;
    border-bottom: 0.5px solid #e8e0d4;
}}

tbody tr:last-child {{
    border-bottom: 2px solid #b8945a;
}}

tr {{
    page-break-inside: avoid;
}}

/* ===== Lists ===== */
ul {{
    margin: 0.3em 0; padding-left: 1.8em; list-style-type: none;
}}

ol {{
    margin: 0.3em 0; padding-left: 1.8em; list-style-type: decimal;
}}

li {{ margin-bottom: 0.2em; }}

li::marker {{ color: #b8945a; }}

/* ===== Emphasis ===== */
strong {{ font-weight: 700; color: #3d3020; }}
em {{ font-style: italic; color: #5a4a38; }}

/* ===== Horizontal rule ===== */
hr {{
    border: none; height: 1px;
    background: linear-gradient(90deg, transparent, #d4c8b8, transparent);
    margin: 0.8cm 0;
}}

/* ===== Links ===== */
a {{ word-break: break-all; color: #8b5a2b; text-decoration: none; }}

/* ===== Images ===== */
img {{ max-width: 100%; height: auto; }}

/* ===== Page break helpers ===== */
figure, blockquote, table, pre {{
    page-break-inside: avoid;
}}
h1, h2, h3, h4 {{
    page-break-inside: avoid;
}}

/* ===== Overflow protection ===== */
pre, table, figure, img, svg, blockquote {{
    max-width: 100%; box-sizing: border-box;
}}
</style>
</head>
<body class="cover-page">

<!-- ===== Cover ===== -->
<div class="cover">
    <div class="corner-flourish corner-flourish-tl"></div>
    <div class="corner-flourish corner-flourish-tr"></div>
    <div class="corner-flourish corner-flourish-bl"></div>
    <div class="corner-flourish corner-flourish-br"></div>
    <div class="cover-circle"></div>
    <div class="cover-circle-2"></div>
    <div class="cover-content">
        <div class="cover-ornament">* * *</div>
        <div class="cover-label">{cover_label}</div>
        <h1 class="cover-title">{title}</h1>
        <div class="cover-divider"></div>
        <p class="cover-subtitle">{subtitle}</p>
        <div class="cover-meta">
            <p>{author_line}</p>
            <p>{date_line}</p>
        </div>
    </div>
</div>

<!-- ===== TOC ===== -->
<div class="toc-page">
    <div class="toc-header">
        <div class="toc-title">目&ensp;录</div>
        <div class="toc-header-sub">CONTENTS</div>
    </div>
    <ul class="toc-list">
{toc_items}
    </ul>
</div>

<!-- ===== Body ===== -->
{body}

</body>
</html>
