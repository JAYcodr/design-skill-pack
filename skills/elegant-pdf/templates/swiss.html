<!-- elegant-pdf template — Swiss International style -->
<!DOCTYPE html>
<html lang="{lang}">
<head>
<meta charset="UTF-8">
<title>{title}</title>
<style>
/* ===== Swiss International ===== */
/* Design DNA: grid system + rational order + red accent + no ornament */

/* ===== Reset ===== */
body {{
    margin: 0; padding: 0;
    font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Helvetica Neue", "Arial", sans-serif;
    font-size: 9.5pt; line-height: 1.6;
    color: #1a1a1a;
    string-set: doctitle "{running_title}";
}}

/* ===== Page ===== */
@page {{
    size: A4; margin: 18mm 16mm 20mm 16mm;
    @top-left {{
        content: string(doctitle);
        font-size: 7pt; color: #999;
        font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Helvetica Neue", sans-serif;
        text-transform: uppercase; letter-spacing: 0.1em;
    }}
    @top-right {{
        content: "";
        font-size: 7pt; color: #ccc;
    }}
    @bottom-center {{
        content: counter(page);
        font-size: 8pt; color: #999;
    }}
}}

@page cover {{
    margin: 0;
    @top-left {{ content: none; }}
    @top-right {{ content: none; }}
    @bottom-center {{ content: none; }}
}}

@page toc {{
    @top-left {{ content: none; }}
    @top-right {{ content: none; }}
}}

/* ===== Cover ===== */
.cover {{
    page: cover; width: 210mm; height: 297mm; margin: 0;
    position: relative; overflow: hidden; page-break-after: always;
    background: #ffffff;
}}

.cover-accent-bar {{
    position: absolute; left: 0; top: 0; bottom: 0;
    width: 12mm; background: #e63946;
}}

.cover-grid {{
    position: absolute; left: 12mm; top: 0; right: 0; bottom: 0;
    background-image:
        linear-gradient(rgba(0,0,0,0.03) 1px, transparent 1px),
        linear-gradient(90deg, rgba(0,0,0,0.03) 1px, transparent 1px);
    background-size: 16mm 16mm;
    opacity: 0.5;
}}

.cover-block-1 {{
    position: absolute; top: 40mm; right: 25mm;
    width: 60px; height: 60px;
    background: #e63946;
}}

.cover-block-2 {{
    position: absolute; top: 55mm; right: 70mm;
    width: 40px; height: 40px;
    border: 3px solid #1a1a1a;
}}

.cover-block-3 {{
    position: absolute; bottom: 80mm; right: 40mm;
    width: 80px; height: 4px;
    background: #1a1a1a;
}}

.cover-number {{
    position: absolute; left: 35mm; top: 60mm;
    font-size: 96pt; font-weight: 900; color: rgba(230,57,70,0.08);
    line-height: 1; letter-spacing: -0.05em;
}}

.cover-content {{
    position: absolute; left: 35mm; top: 50%;
    transform: translateY(-50%); width: 55%; z-index: 1;
}}

.cover-label {{
    font-size: 8pt; letter-spacing: 0.4em; color: #999;
    text-transform: uppercase; margin-bottom: 15mm;
    font-weight: 500;
}}

.cover-title {{
    font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 36pt; font-weight: 900; color: #1a1a1a;
    margin-bottom: 8mm; line-height: 1.15; letter-spacing: -0.02em;
    border: none !important; page-break-before: auto !important;
}}

.cover-subtitle {{
    font-size: 14pt; color: #666; font-weight: 300;
    margin-bottom: 25mm; line-height: 1.5;
}}

.cover-divider {{
    width: 40mm; height: 4px;
    background: #e63946; margin-bottom: 15mm;
}}

.cover-meta {{
    font-size: 9pt; color: #888; line-height: 2.2;
    font-weight: 400;
}}

.cover-meta p {{ margin: 0.1em 0; }}

/* ===== TOC ===== */
.toc-page {{
    page: toc; page-break-after: always;
}}

.toc-title {{
    font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 24pt; font-weight: 900; color: #1a1a1a;
    margin-bottom: 18mm; margin-top: 5mm;
    letter-spacing: -0.02em;
    border-bottom: 4px solid #1a1a1a;
    padding-bottom: 5mm;
}}

.toc-list {{
    list-style: none; padding: 0; margin: 0;
}}

.toc-list li {{
    margin-bottom: 0.4em;
}}

.toc-list a {{
    color: #1a1a1a; text-decoration: none; display: block;
    padding: 0.4em 0; border-bottom: 0.5px solid #e5e5e5;
    font-size: 9.5pt;
}}

.toc-list a::after {{
    content: "      " target-counter(attr(href), page);
    /* leader(".") removed: WeasyPrint renders it as garbled chars */
    float: right; color: #999;
}}

.toc-l1 > a {{
    font-weight: 700; font-size: 10.5pt; color: #1a1a1a;
    border-bottom-color: #ccc; margin-top: 0.5em;
}}

.toc-l2 {{
    padding-left: 18px; font-size: 9pt;
}}

/* ===== Headings ===== */
h1 {{
    font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 20pt; font-weight: 900; color: #1a1a1a;
    margin-top: 0; margin-bottom: 5mm; padding: 0;
    page-break-before: always;
    string-set: doctitle content();
    counter-increment: chapter;
}}

h1::before {{
    content: "0" counter(chapter) "  ";
    color: #e63946; font-size: 0.7em; vertical-align: top;
}}

body.cover-page h1:first-of-type {{
    page-break-before: auto;
}}

h1::after {{
    content: "";
    display: block; width: 100%; height: 2px;
    background: #1a1a1a; margin-top: 3mm;
}}

h2 {{
    font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 13pt; font-weight: 700; color: #1a1a1a;
    margin-top: 12mm; margin-bottom: 4mm;
    padding-bottom: 2mm;
    border-bottom: 1px solid #e5e5e5;
    page-break-after: avoid;
}}

h3 {{
    font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 10.5pt; font-weight: 700; color: #333;
    margin-top: 8mm; margin-bottom: 3mm;
    page-break-after: avoid;
}}

h4 {{
    font-family: "Noto Sans CJK SC", "Source Han Sans SC", "PingFang SC", "Helvetica Neue", sans-serif;
    font-size: 9.5pt; font-weight: 700; color: #333;
    margin-top: 6mm; margin-bottom: 2mm;
}}

/* ===== Paragraphs ===== */
p {{
    margin: 0.3em 0; orphans: 2; widows: 2;
    text-align: justify; text-align-last: left;
}}

/* ===== Blockquotes ===== */
blockquote {{
    background: #fafafa; border-left: 4px solid #e63946;
    padding: 1em 1.2em; margin: 8mm 0;
    font-size: 9pt; color: #555;
}}

blockquote p {{ margin: 0.2em 0; }}

/* ===== Code ===== */
code {{
    font-family: "SF Mono", "Menlo", "Courier New", monospace;
    font-size: 8.5pt; background: #f5f5f5;
    padding: 0.15em 0.4em; border-radius: 2px; color: #cc3344;
}}

pre {{
    background: #fafafa; border: 1px solid #e5e5e5;
    padding: 1em; margin: 6mm 0;
    font-size: 8pt; line-height: 1.5; overflow-x: auto;
    page-break-inside: avoid;
}}

pre code {{ background: none; padding: 0; color: #333; }}

/* ===== Tables ===== */
table {{
    width: 100%; max-width: 100%; border-collapse: collapse;
    margin: 5mm 0; font-size: 9pt; box-sizing: border-box;
}}

thead tr {{
    background: #2a2a2a; color: #ffffff;
    border: none;
}}

th {{
    padding: 0.5em 0.6em; text-align: left;
    font-weight: 600; text-transform: uppercase;
    font-size: 7.5pt; letter-spacing: 0.06em;
}}

td {{
    padding: 0.4em 0.6em; text-align: left; vertical-align: top;
}}

tbody tr:nth-child(even) {{ background: #fafafa; }}
tbody tr:nth-child(odd) {{ background: #ffffff; }}
tbody tr {{ border-bottom: 0.5px solid #e5e5e5; }}
tbody tr:last-child {{ border-bottom: 2px solid #1a1a1a; }}



/* ===== Lists ===== */
ul {{
    margin: 0.3em 0; padding-left: 2em;
    list-style-type: none;
}}
ul li::before {{
    content: "—";
    display: inline-block; width: 1.5em; margin-left: -1.5em;
    color: #e63946;
}}

ol {{
    margin: 0.3em 0; padding-left: 2em;
    list-style-type: decimal;
}}

li {{ margin-bottom: 0.2em; }}

/* ===== Emphasis ===== */
strong {{ font-weight: 700; color: #1a1a1a; }}
em {{ font-style: italic; color: #555; }}

/* ===== Horizontal rule ===== */
hr {{
    border: none; height: 1px;
    background: #e0e0e0;
    margin: 10mm 0;
}}

/* ===== Links ===== */
a {{ word-break: break-all; color: #e63946; text-decoration: none; }}

/* ===== Images ===== */
img {{ max-width: 100%; height: auto; }}

/* ===== Page break helpers ===== */
figure, blockquote, pre {{ page-break-inside: avoid; }}
h1, h2, h3, h4 {{ page-break-inside: avoid; }}

/* ===== Overflow protection ===== */
pre, table, figure, img, svg, blockquote {{
    max-width: 100%; box-sizing: border-box;
}}
</style>
</head>
<body class="cover-page">

<!-- ===== Cover ===== -->
<div class="cover">
    <div class="cover-accent-bar"></div>
    <div class="cover-grid"></div>
    <div class="cover-block-1"></div>
    <div class="cover-block-2"></div>
    <div class="cover-block-3"></div>
    <div class="cover-number">01</div>
    <div class="cover-content">
        <div class="cover-label">{cover_label}</div>
        <h1 class="cover-title">{title}</h1>
        <p class="cover-subtitle">{subtitle}</p>
        <div class="cover-divider"></div>
        <div class="cover-meta">
            <p>{author_line}</p>
            <p>{date_line}</p>
        </div>
    </div>
</div>

<!-- ===== TOC ===== -->
<div class="toc-page">
    <div class="toc-title">Contents</div>
    <ul class="toc-list">
{toc_items}
    </ul>
</div>

<!-- ===== Body ===== -->
{body}

</body>
</html>
